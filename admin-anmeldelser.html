<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldelser — Castillo del Alma Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6ee;--beige:#f0e8d5;--sand:#e0d0b0;
  --charcoal:#2c2318;--text-mid:#5c4e3a;--text-light:#9a8c7a;
  --wine:#7a1f35;--gold:#b88a1e;--teal:#3a6e6a;--olive:#6a7240;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:#1e1810;color:#e8dcc8;min-height:100vh;}

/* ── LOGIN ── */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#1e1810;
}
.login-box{
  background:rgba(250,246,238,.05);border:1px solid rgba(184,138,30,.2);
  padding:3rem;text-align:center;width:360px;
}
.login-box h2{
  font-family:'Cinzel',serif;font-weight:300;font-size:1.4rem;
  letter-spacing:.1em;color:#e8dcc8;margin-bottom:.5rem;
}
.login-box p{font-size:.75rem;color:rgba(232,220,200,.4);margin-bottom:2rem;letter-spacing:.1em;}
.login-box input{
  width:100%;padding:.85rem 1rem;margin-bottom:.8rem;
  background:rgba(255,255,255,.06);border:1px solid rgba(184,138,30,.2);
  color:#e8dcc8;font-family:'Manrope',sans-serif;font-size:.85rem;
  outline:none;transition:border-color .3s;
}
.login-box input:focus{border-color:rgba(184,138,30,.5);}
.login-box button{
  width:100%;padding:.85rem;background:var(--wine);color:#fff;border:none;
  font-family:'Manrope',sans-serif;font-size:.7rem;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .3s;
}
.login-box button:hover{background:#a03048;}
.login-error{color:#e07070;font-size:.75rem;margin-top:.8rem;display:none;}

/* ── DASHBOARD ── */
.dashboard{display:none;min-height:100vh;}
.dash-header{
  background:rgba(0,0,0,.3);border-bottom:1px solid rgba(184,138,30,.15);
  padding:1.2rem 3rem;display:flex;justify-content:space-between;align-items:center;
}
.dash-header h1{
  font-family:'Cinzel',serif;font-weight:300;font-size:1.1rem;
  letter-spacing:.1em;color:#e8dcc8;
}
.dash-header-right{display:flex;gap:1rem;align-items:center;}
.dash-header-right a{
  font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(232,220,200,.4);text-decoration:none;transition:color .3s;
}
.dash-header-right a:hover{color:var(--gold);}
.logout-btn{
  font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(232,220,200,.35);background:none;border:1px solid rgba(232,220,200,.15);
  padding:.4rem .9rem;cursor:pointer;transition:all .3s;
}
.logout-btn:hover{border-color:rgba(232,220,200,.4);color:rgba(232,220,200,.7);}

/* ── STATS BAR ── */
.stats-bar{
  padding:2rem 3rem;display:flex;gap:2rem;flex-wrap:wrap;
  border-bottom:1px solid rgba(184,138,30,.1);
}
.stat{
  background:rgba(255,255,255,.04);border:1px solid rgba(184,138,30,.12);
  padding:1.2rem 1.8rem;min-width:140px;
}
.stat-num{
  font-family:'Cinzel',serif;font-size:2rem;
  color:var(--gold);font-weight:300;display:block;line-height:1;
}
.stat-label{
  font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(232,220,200,.35);margin-top:.3rem;display:block;
}

/* ── FILTERS ── */
.filters{
  padding:1.5rem 3rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid rgba(184,138,30,.1);
}
.filter-btn{
  font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
  padding:.45rem 1rem;background:none;
  border:1px solid rgba(184,138,30,.2);color:rgba(232,220,200,.5);
  cursor:pointer;transition:all .3s;
}
.filter-btn:hover,.filter-btn.active{background:rgba(184,138,30,.12);color:var(--gold);border-color:rgba(184,138,30,.4);}
.filter-label{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(232,220,200,.25);margin-right:.3rem;}
#searchInput{
  margin-left:auto;padding:.45rem .9rem;
  background:rgba(255,255,255,.05);border:1px solid rgba(184,138,30,.15);
  color:#e8dcc8;font-size:.78rem;font-family:'Manrope',sans-serif;
  outline:none;width:200px;transition:border-color .3s;
}
#searchInput:focus{border-color:rgba(184,138,30,.4);}

/* ── REVIEWS GRID ── */
.reviews-grid{
  padding:2rem 3rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
  gap:1.2rem;
}
.review-card{
  background:rgba(255,255,255,.04);border:1px solid rgba(184,138,30,.12);
  padding:1.8rem;position:relative;transition:border-color .3s;
}
.review-card:hover{border-color:rgba(184,138,30,.3);}
.review-card.approved{border-left:3px solid var(--olive);}
.review-card.rejected{opacity:.4;}

.rc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.2rem;}
.rc-name{
  font-family:'Cinzel',serif;font-weight:300;font-size:.95rem;
  color:#e8dcc8;letter-spacing:.05em;
}
.rc-meta{font-size:.62rem;color:rgba(232,220,200,.35);margin-top:.2rem;letter-spacing:.05em;}
.rc-retreat{
  font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);background:rgba(184,138,30,.1);
  padding:.2rem .6rem;white-space:nowrap;
}

.rc-stars{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.2rem;}
.rc-star-row{display:flex;justify-content:space-between;align-items:center;}
.rc-star-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,220,200,.4);}
.rc-star-val{
  display:flex;align-items:center;gap:.3rem;
  font-size:.75rem;color:var(--gold);
}
.rc-star-num{font-size:.62rem;color:rgba(232,220,200,.4);margin-left:.2rem;}

.rc-quote{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:.98rem;color:rgba(232,220,200,.7);
  line-height:1.7;margin-bottom:1.2rem;
  padding-left:1rem;border-left:1px solid rgba(184,138,30,.25);
}
.rc-quote-empty{color:rgba(232,220,200,.2);font-style:italic;font-size:.85rem;}

.rc-consent{
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.2rem .6rem;display:inline-block;margin-bottom:1rem;
}
.rc-consent.ja{color:var(--olive);background:rgba(106,114,64,.12);}
.rc-consent.anonymt{color:var(--teal);background:rgba(58,110,106,.12);}
.rc-consent.nej{color:rgba(192,92,48,.8);background:rgba(192,92,48,.1);}

.rc-actions{display:flex;gap:.6rem;flex-wrap:wrap;}
.rc-btn{
  font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;
  padding:.4rem .9rem;border:none;cursor:pointer;transition:all .3s;
}
.rc-btn-approve{background:rgba(106,114,64,.2);color:#a0c880;border:1px solid rgba(106,114,64,.3);}
.rc-btn-approve:hover{background:rgba(106,114,64,.35);}
.rc-btn-reject{background:rgba(192,92,48,.1);color:rgba(192,92,48,.7);border:1px solid rgba(192,92,48,.2);}
.rc-btn-reject:hover{background:rgba(192,92,48,.2);}
.rc-btn-copy{background:rgba(184,138,30,.1);color:var(--gold);border:1px solid rgba(184,138,30,.2);}
.rc-btn-copy:hover{background:rgba(184,138,30,.2);}
.rc-btn-export{background:rgba(58,110,106,.15);color:rgba(90,160,156,.8);border:1px solid rgba(58,110,106,.25);}
.rc-btn-export:hover{background:rgba(58,110,106,.3);}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:5rem 2rem;color:rgba(232,220,200,.25);
}
.empty-state p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:2rem;right:2rem;
  background:rgba(106,114,64,.9);color:#fff;
  padding:.8rem 1.5rem;font-size:.72rem;letter-spacing:.1em;
  opacity:0;transform:translateY(10px);
  transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ── LOADING ── */
.loading{
  text-align:center;padding:4rem;
  font-family:'Cormorant Garamond',serif;font-style:italic;
  color:rgba(232,220,200,.3);font-size:1rem;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>Castillo del Alma</h2>
    <p>ANMELDELSER · ADMIN</p>
    <input type="password" id="pwInput" placeholder="Adgangskode" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Log ind</button>
    <div class="login-error" id="loginError">Forkert adgangskode</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

  <div class="dash-header">
    <h1>Castillo del Alma — Anmeldelser</h1>
    <div class="dash-header-right">
      <a href="#" onclick="exportAll()">Eksportér alle (CSV)</a>
      <a href="index.html">← Hjemmeside</a>
      <button class="logout-btn" onclick="doLogout()">Log ud</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat"><span class="stat-num" id="statTotal">—</span><span class="stat-label">Anmeldelser</span></div>
    <div class="stat"><span class="stat-num" id="statAvg">—</span><span class="stat-label">Gns. samlet</span></div>
    <div class="stat"><span class="stat-num" id="statRecommend">—</span><span class="stat-label">Gns. anbefaling</span></div>
    <div class="stat"><span class="stat-num" id="statConsent">—</span><span class="stat-label">Samtykke givet</span></div>
  </div>

  <div class="filters">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" onclick="setFilter('all',this)">Alle</button>
    <button class="filter-btn" onclick="setFilter('ja',this)">Samtykke: Ja</button>
    <button class="filter-btn" onclick="setFilter('anonymt',this)">Anonymt</button>
    <button class="filter-btn" onclick="setFilter('approved',this)">Godkendt</button>
    <button class="filter-btn" onclick="setFilter('5star',this)">★★★★★</button>
    <input type="text" id="searchInput" placeholder="Søg navn, retreat..." oninput="renderReviews()">
  </div>

  <div class="reviews-grid" id="reviewsGrid">
    <div class="loading">Henter anmeldelser...</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const FORM_ID   = 'xykawbvk';
const API_BASE  = `https://formspree.io/api/0/forms/${FORM_ID}/submissions`;
const PASS      = 'castillo2025'; // skift dette til din egen adgangskode

let allReviews  = [];
let approved    = JSON.parse(localStorage.getItem('cda_approved') || '[]');
let rejected    = JSON.parse(localStorage.getItem('cda_rejected') || '[]');
let currentFilter = 'all';

// ── LOGIN ──
function doLogin() {
  const pw = document.getElementById('pwInput').value;
  if (pw === PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadReviews();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pwInput').value = '';
  }
}
function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pwInput').value = '';
}

// ── LOAD FROM FORMSPREE ──
async function loadReviews() {
  try {
    const res = await fetch(API_BASE + '?pageSize=100', {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error('API fejl');
    const data = await res.json();
    allReviews = (data.submissions || []).map(parseSubmission);
    updateStats();
    renderReviews();
  } catch(e) {
    document.getElementById('reviewsGrid').innerHTML =
      '<div class="empty-state"><p>Kunne ikke hente anmeldelser. Tjek at Formspree API-adgang er aktiveret på din konto (kræver Plus-plan).<br><br>Alternativt: du kan se alle svar direkte på formspree.io/forms/' + FORM_ID + '</p></div>';
  }
}

function parseSubmission(s) {
  // Formspree sender felter direkte
  return {
    id: s._id || s.id || Math.random().toString(),
    date: s._date || s.date || '',
    navn: s.navn || '—',
    retreat: s.retreat || '—',
    land: s.land || '—',
    besøgt: s.besøgt || '—',
    samlet: s.samlet || '—',
    anbefaling: s.anbefaling || '—',
    samtykke: s.samtykke || 'nej',
    bedste: s.bedste || '',
    forandring: s.forandring || '',
    raw: s.message || '',
    consent: s.samtykke || 'nej',
  };
}

// ── STATS ──
function updateStats() {
  document.getElementById('statTotal').textContent = allReviews.length;
  const samtals = allReviews.map(r => parseInt(r.samlet)).filter(n => !isNaN(n));
  const avg = samtals.length ? (samtals.reduce((a,b)=>a+b,0)/samtals.length).toFixed(1) : '—';
  document.getElementById('statAvg').textContent = avg + (avg !== '—' ? ' ★' : '');
  const anb = allReviews.map(r => parseInt(r.anbefaling)).filter(n => !isNaN(n));
  const avgA = anb.length ? (anb.reduce((a,b)=>a+b,0)/anb.length).toFixed(1) : '—';
  document.getElementById('statRecommend').textContent = avgA + (avgA !== '—' ? ' ★' : '');
  const consented = allReviews.filter(r => r.consent === 'ja' || r.consent === 'anonymt').length;
  document.getElementById('statConsent').textContent = consented;
}

// ── FILTER & RENDER ──
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderReviews();
}

function renderReviews() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  let filtered = allReviews.filter(r => {
    if (currentFilter === 'ja') return r.consent === 'ja';
    if (currentFilter === 'anonymt') return r.consent === 'anonymt';
    if (currentFilter === 'approved') return approved.includes(r.id);
    if (currentFilter === '5star') return parseInt(r.samlet) >= 5;
    return true;
  }).filter(r => {
    if (!search) return true;
    return (r.navn + r.retreat + r.land + r.bedste).toLowerCase().includes(search);
  });

  if (filtered.length === 0) {
    document.getElementById('reviewsGrid').innerHTML = '<div class="empty-state"><p>Ingen anmeldelser matcher filteret.</p></div>';
    return;
  }

  document.getElementById('reviewsGrid').innerHTML = filtered.map(r => renderCard(r)).join('');
}

function renderCard(r) {
  const isApproved = approved.includes(r.id);
  const isRejected = rejected.includes(r.id);
  const stars = n => '★'.repeat(n) + '☆'.repeat(5-n);
  const quote = r.bedste || r.forandring || '';

  // Parse samlet score for stars display
  const samtalNum = parseInt(r.samlet) || 0;
  const anbNum = parseInt(r.anbefaling) || 0;

  return `<div class="review-card ${isApproved?'approved':''} ${isRejected?'rejected':''}" id="card_${r.id}">
    <div class="rc-header">
      <div>
        <div class="rc-name">${r.navn}</div>
        <div class="rc-meta">${r.land} · ${r.besøgt || r.date || '—'}</div>
      </div>
      <span class="rc-retreat">${r.retreat}</span>
    </div>
    <div class="rc-stars">
      <div class="rc-star-row">
        <span class="rc-star-label">Samlet oplevelse</span>
        <span class="rc-star-val">${stars(samtalNum)}<span class="rc-star-num">${r.samlet}</span></span>
      </div>
      <div class="rc-star-row">
        <span class="rc-star-label">Anbefaling</span>
        <span class="rc-star-val">${stars(anbNum)}<span class="rc-star-num">${r.anbefaling}</span></span>
      </div>
    </div>
    ${quote ? `<div class="rc-quote">"${quote.substring(0,200)}${quote.length>200?'…':''}"</div>` : '<div class="rc-quote rc-quote-empty">Ingen fritekst</div>'}
    <span class="rc-consent ${r.consent}">${r.consent === 'ja' ? '✓ Samtykke givet' : r.consent === 'anonymt' ? '~ Anonymt samtykke' : '✗ Intet samtykke'}</span>
    <div class="rc-actions">
      <button class="rc-btn rc-btn-approve" onclick="approveReview('${r.id}')">${isApproved ? '✓ Godkendt' : 'Godkend'}</button>
      <button class="rc-btn rc-btn-reject" onclick="rejectReview('${r.id}')">Afvis</button>
      <button class="rc-btn rc-btn-copy" onclick="copyQuote('${r.id}')">Kopiér citat</button>
      <button class="rc-btn rc-btn-export" onclick="showFull('${r.id}')">Se fuld anmeldelse</button>
    </div>
  </div>`;
}

// ── ACTIONS ──
function approveReview(id) {
  if (!approved.includes(id)) approved.push(id);
  rejected = rejected.filter(x => x !== id);
  localStorage.setItem('cda_approved', JSON.stringify(approved));
  localStorage.setItem('cda_rejected', JSON.stringify(rejected));
  renderReviews();
  showToast('Anmeldelse godkendt ✓');
}

function rejectReview(id) {
  if (!rejected.includes(id)) rejected.push(id);
  approved = approved.filter(x => x !== id);
  localStorage.setItem('cda_approved', JSON.stringify(approved));
  localStorage.setItem('cda_rejected', JSON.stringify(rejected));
  renderReviews();
  showToast('Anmeldelse afvist');
}

function copyQuote(id) {
  const r = allReviews.find(x => x.id === id);
  if (!r) return;
  const name = r.consent === 'anonymt' ? 'Anonym gæst' : r.navn;
  const text = `"${r.bedste || r.forandring}" — ${name}`;
  navigator.clipboard.writeText(text).then(() => showToast('Citat kopieret til udklipsholder'));
}

function showFull(id) {
  const r = allReviews.find(x => x.id === id);
  if (!r) return;
  alert(r.raw || JSON.stringify(r, null, 2));
}

function exportAll() {
  const rows = [
    ['Navn','Retreat','Land','Besøgt','Samlet','Anbefaling','Samtykke','Bedste ved opholdet','Forandring','Dato']
  ];
  allReviews.forEach(r => rows.push([r.navn,r.retreat,r.land,r.besøgt,r.samlet,r.anbefaling,r.consent,r.bedste,r.forandring,r.date]));
  const csv = rows.map(r => r.map(c => '"'+(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'anmeldelser-castillo-del-alma.csv'; a.click();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
