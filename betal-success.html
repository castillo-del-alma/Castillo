<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betaling bekræftet — Castillo del Alma</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:#faf6ee;color:#2c2318;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.box{max-width:480px;text-align:center;background:#f0e8d5;border:1px solid rgba(184,138,30,.25);padding:3.5rem 3rem;}
.icon{width:60px;height:60px;border-radius:50%;background:rgba(90,99,50,.12);border:1px solid rgba(90,99,50,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:1.8rem;color:#5a6028;}
.eyebrow{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:#8a6315;margin-bottom:.8rem;}
h1{font-family:'Cinzel',serif;font-weight:300;font-size:1.7rem;letter-spacing:.06em;margin-bottom:1rem;}
p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:rgba(44,35,24,.65);line-height:1.8;margin-bottom:2rem;}
.btn{display:inline-block;background:#7a1f35;color:#fff;padding:.9rem 2rem;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">✓</div>
  <div class="eyebrow">Castillo del Alma</div>
  <h1 id="bsTitel">Betaling bekræftet</h1>
  <p id="bsTekst">Tak for din betaling. Din plads til retreatet er nu sikret. Du modtager en bekræftelse på email inden for kort tid.</p>
  <a href="min-booking.html" class="btn" id="bsKnap">Se min booking</a>
</div>

<script>
(function () {
  'use strict';
  var T = {
    da: {
      titel: 'Betaling bekræftet',
      tekst: 'Tak for din betaling. Din plads til retreatet er nu sikret. Du modtager en bekræftelse på email inden for kort tid.',
      knap: 'Se min booking',
      sidetitel: 'Betaling bekræftet — Castillo del Alma'
    },
    en: {
      titel: 'Payment confirmed',
      tekst: 'Thank you for your payment. Your place on the retreat is now secured. You will receive a confirmation by email shortly.',
      knap: 'See my booking',
      sidetitel: 'Payment confirmed — Castillo del Alma'
    }
  };

  // Samme sproglogik som resten af sitet: geo først, ellers browsersprog
  async function findSprog() {
    // Kundens sprog kommer med i URL'en fra Stripe success_url — det vinder over geo.
    try {
      var urlLang = new URLSearchParams(location.search).get('lang');
      if (urlLang === 'da' || urlLang === 'en') return urlLang;
    } catch (e) {}
    try {
      var c = sessionStorage.getItem('cda_geo_lang');
      if (c === 'da' || c === 'en') return c;
    } catch (e) {}
    try {
      var ctrl = new AbortController();
      var t = setTimeout(function () { ctrl.abort(); }, 4000);
      var res = await fetch('/.netlify/functions/geo-lang', { signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) {
        var geo = await res.json();
        if (geo && (geo.lang === 'da' || geo.lang === 'en')) {
          try { sessionStorage.setItem('cda_geo_lang', geo.lang); } catch (e) {}
          return geo.lang;
        }
      }
    } catch (e) {}
    return (navigator.language || '').toLowerCase().indexOf('da') === 0 ? 'da' : 'en';
  }

  findSprog().then(function (lang) {
    var t = T[lang] || T.da;
    document.documentElement.lang = lang;
    document.title = t.sidetitel;
    document.getElementById('bsTitel').textContent = t.titel;
    document.getElementById('bsTekst').textContent = t.tekst;
    document.getElementById('bsKnap').textContent = t.knap;
  });
})();
</script>
</body>
</html>
