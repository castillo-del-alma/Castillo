<title>Seværdigheder nær Castillo del Alma — Mollina, Málaga</title>

<style>
:root {
  --cream:      #faf6ee;
  --beige:      #f0e8d5;
  --sand:       #e0d0b0;
  --stone:      #c8b898;
  --charcoal:   #2c2318;
  --text:       #2c2318;
  --text-mid:   #5c4e3a;
  --text-light: #9a8c7a;
  --wine:       #7a1f35;
  --wine-light: #a03048;
  --terracotta: #c05c30;
  --olive:      #6a7240;
  --gold:       #b88a1e;
  --gold-light: #d4a830;
  --gold-pale:  #eedea0;
  --teal:       #3a6e6a;
  --section-alt:#ede4d0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Manrope',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden;}
img{max-width:100%;display:block;}
a{color:inherit;}

/* ── NAV — identisk med gay-retreat-siden ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  padding:1.4rem 4rem;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(250,246,238,.96);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(184,138,30,.15);
  box-shadow:0 2px 28px rgba(44,35,24,.06);
}
.nav-logo img{height:48px;width:auto;}
.nav-links{display:flex;gap:2rem;list-style:none;align-items:center;}
.nav-links a{font-size:.68rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mid);text-decoration:none;transition:color .3s;}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--wine);}
.nav-back{
  font-size:.68rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
  color:var(--wine);text-decoration:none;display:flex;align-items:center;gap:.5rem;
}
.nav-burger{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:.4rem;position:relative;z-index:9999;}
.nav-burger span{display:block;width:24px;height:1.5px;background:var(--wine);transition:.3s;}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(44,35,24,.45);z-index:9990;}
.nav-backdrop.open{display:block;}

/* ── FÆLLES ── */
.eyebrow{
  font-family:'Manrope',sans-serif;font-size:.6rem;
  letter-spacing:.4em;text-transform:uppercase;color:var(--gold);
  margin-bottom:1.4rem;display:flex;align-items:center;gap:1rem;
}
.eyebrow::before{content:'';width:28px;height:1px;background:var(--gold);flex-shrink:0;}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:400;line-height:1.15;letter-spacing:.01em;}
h1{font-size:clamp(2.4rem,5.6vw,4.6rem);}
h2{font-size:clamp(1.7rem,3.4vw,2.7rem);margin-bottom:1.6rem;}
h3{font-size:1.05rem;letter-spacing:.04em;margin-bottom:.7rem;}
p{font-family:'Cormorant Garamond',serif;font-size:1.16rem;line-height:1.78;color:var(--text-mid);}
.lede{font-size:1.36rem;line-height:1.7;color:var(--text);}
/* Sitets faste geometri — samme som ejendommen, udlejning, retreat og
   forsiden: 8 rem lodret luft, .section-inner på 1320 px, 4 rem sidemargin. */
section{padding:8rem 0;}
.section-inner{max-width:1320px;margin:0 auto;padding:0 4rem;}
.narrow{max-width:888px;margin:0 auto;padding:0 4rem;}
.alt{background:var(--section-alt);}
.rule{width:56px;height:1px;background:var(--gold);margin:2.2rem 0;}
.rule.center{margin-left:auto;margin-right:auto;}

/* ── LINKS I BRØDTEKST ────────────────────────────────────────────────────
   a{color:inherit} ovenfor gælder nav, footer og kort, hvor et link ikke
   skal skille sig ud. Men i løbende tekst SKAL et link kunne ses, ellers
   opdager ingen det. Understregningen er dæmpet og lægger sig lidt under
   grundlinjen, så den ikke skærer gennem bogstavstaver.
   Pilen ↗ signalerer, at man forlader sitet. */
section p a, section li a, .fakta-linje dd a, .fakta-punkt a, .faq-a a,
.kol-liste a, .hoej-punkter a {
  color:var(--wine);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-decoration-color:rgba(122,31,53,.32);
  text-underline-offset:3px;
  transition:color .25s,text-decoration-color .25s;
}
section p a:hover, section li a:hover, .fakta-linje dd a:hover,
.fakta-punkt a:hover, .faq-a a:hover, .kol-liste a:hover, .hoej-punkter a:hover,
section p a:focus-visible, section li a:focus-visible {
  color:var(--wine-light);
  text-decoration-color:var(--wine-light);
}
/* Det mørke bånd: vinrød forsvinder mod charcoal, så her bruges guld */
.hoej p a, .hoej li a, .hoej-punkter a {
  color:var(--gold-light);
  text-decoration-color:rgba(212,168,48,.4);
}
.hoej p a:hover, .hoej li a:hover, .hoej-punkter a:hover {
  color:var(--gold-pale);
  text-decoration-color:var(--gold-pale);
}
.cta-band p a { color:var(--gold-light); text-decoration-color:rgba(212,168,48,.4); }
.cta-band p a:hover { color:var(--gold-pale); }
/* Ydre link åbner nyt faneblad — pilen fortæller det på forhånd */
section a[target="_blank"]::after {
  content:'\2197';
  font-family:'Manrope',sans-serif;
  font-size:.72em;
  margin-left:.18em;
  opacity:.65;
  text-decoration:none;
  display:inline-block;
}

/* ── HERO — samme opbygning som gay-retreat-siden ── */
.hero{
  position:relative;min-height:100svh;display:flex;align-items:flex-end;
  padding:0 0 4.5rem;margin-top:0;overflow:hidden;
}
.hero-bg{position:absolute;inset:0;overflow:hidden;background:var(--charcoal);}
.hero-bg img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.06);
  animation:kenburns 26s ease-out forwards;
}
.hero-bg::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(44,35,24,.42) 0%,rgba(44,35,24,.14) 38%,rgba(44,35,24,.86) 100%),
    radial-gradient(120% 90% at 78% 40%,transparent 35%,rgba(44,35,24,.38) 100%);
}
.hero-inner{position:relative;z-index:2;width:100%;padding:0 4rem;}
.hero-content{
  max-width:1320px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:flex-end;gap:3rem;
}
.hero-text{max-width:680px;}
.hero h1{color:#fff;text-shadow:0 2px 40px rgba(0,0,0,.45);font-size:clamp(2.6rem,6.2vw,5.2rem);}
.hero .eyebrow{color:var(--gold-light);}
.hero p{color:rgba(255,255,255,.93);font-size:1.3rem;margin-top:1.7rem;max-width:610px;text-shadow:0 1px 18px rgba(0,0,0,.45);}
/* Guldstribe langs bunden — samme greb som pride-striben på gay-siden,
   her i sitets guld. Slås til og fra i admin under 2 · Hero. */
.hero-stribe{
  position:absolute;bottom:0;left:0;right:0;height:4px;z-index:3;
  background:linear-gradient(90deg,var(--wine),var(--gold),var(--teal));
  display:none;
}
.hero.har-stribe .hero-stribe{display:block;}
/* Nøgletal i firkanter — samme udtryk som .pill i retreat-siden hero */
.hero-meta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2.2rem;}
.hero-meta span{
  font-size:.6rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.8);
  padding:.5rem 1.05rem;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  white-space:nowrap;
}
.hero-scroll{
  display:flex;flex-direction:column;align-items:center;gap:.7rem;
  text-decoration:none;color:rgba(255,255,255,.78);flex-shrink:0;padding-bottom:.4rem;
  font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
  transition:color .3s;
}
.hero-scroll:hover,.hero-scroll:focus-visible{color:#fff;}
.hero-scroll i{font-style:normal;font-size:1rem;line-height:1;animation:nudge 2.4s ease-in-out infinite;}
@keyframes kenburns{to{transform:scale(1.15);}}
@keyframes riseIn{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:none;}}
@keyframes nudge{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}
.hero .eyebrow{animation:riseIn .85s .3s both;}
.hero h1{animation:riseIn .95s .45s both;}
.hero-text p{animation:riseIn .95s .65s both;}
.hero-meta{animation:riseIn .95s .82s both;}
.hero-scroll{animation:riseIn .95s 1.05s both;}

/* ── BILLEDE MED RØD BILLEDTEKST ──────────────────────────────────────────
   Den røde kasse er nøjagtig samme udtryk som .omos-billedlabel på
   gay-siden: vinrød bund, hvid versal-tekst, i billedets nederste højre
   hjørne. Er billedteksten tom, vises kassen ikke. */
/* Billedet beholder sit eget format. Ingen fast højde og ingen
   beskæring: et 16:9-foto bliver liggende, et 9:16-foto bliver stående,
   præcis som filen blev uploadet. Figuren krymper om billedet
   (`width:fit-content`), så den røde billedtekst altid sidder i BILLEDETS
   hjørne og ikke i et tomt felt ved siden af. `margin` auto centrerer
   billedet i sin spalte, når det er smallere end spalten. */
.fig{
  position:relative;overflow:hidden;
  width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;
}
.fig img{width:100%;height:auto;display:block;transition:transform 1.2s ease;}
.fig:hover img{transform:scale(1.03);}
.fig-label{
  position:absolute;bottom:0;right:0;background:var(--wine);color:#fff;
  font-family:'Manrope',sans-serif;font-size:.6rem;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;padding:.65rem 1.1rem;
  max-width:82%;
}


/* ── TO-KOLONNE ── */
.split{display:grid;grid-template-columns:1fr 1fr;gap:4.5rem;align-items:center;}
/* ── BILLEDETS PLADS ──────────────────────────────────────────────────────
   Sektionerne kan sættes op på tre måder fra admin. Rækkefølgen styres med
   `order` frem for at flytte rundt i HTML'en, så DOM'en er den samme uanset
   valg — det holder oplæsningsrækkefølgen for skærmlæsere ens og gør, at et
   skift ikke kræver ny opbygning af siden.
   Uden billede falder teksten til samme bredde som FAQ. Ren brødtekst over
   1320 px er svær at læse, fordi øjet mister linjen på vej tilbage. */
.split > .sv-tekst{order:1;}
.split > .fig{order:2;}
.split.bil-venstre > .sv-tekst{order:2;}
.split.bil-venstre > .fig{order:1;}
.split.bil-ingen{grid-template-columns:1fr;max-width:888px;margin-left:auto;margin-right:auto;}
.split.bil-ingen > .fig{display:none;}

/* ── FOTOSTRIBE — op til 5 billeder ── */
.foto-stribe{padding:var(--stribe-top,2rem) 0 var(--stribe-bund,2rem);}
.foto-stribe-grid{display:grid;gap:.6rem;margin:0 auto;}
.stribe-felt{
  position:relative;overflow:hidden;aspect-ratio:1/1;
  background:var(--sand);transition:transform .4s;
}
.stribe-felt:hover{transform:scale(1.05);}
.stribe-felt img{width:100%;height:100%;object-fit:cover;display:block;}
.stribe-felt .stribe-accent{position:absolute;top:0;left:0;right:0;height:4px;z-index:2;}

/* ── KOLONNELISTER (dyreliv, flora) ──────────────────────────────────────
   Samme guldstreg over overskriften som .feature-item, men med punkter
   under. Kolonnerne ombryder af sig selv, så 2, 3 eller 4 lister alle
   står pænt uden at skulle indstilles. */
.kol-lister{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2.6rem;margin-top:3rem;}
.kol-liste{border-top:1px solid rgba(184,138,30,.3);padding-top:1.3rem;}
.kol-liste ul{list-style:none;margin-top:.9rem;}
.kol-liste li{
  font-family:'Cormorant Garamond',serif;font-size:1.06rem;line-height:1.66;
  color:var(--text-mid);padding-left:1.1rem;position:relative;margin-bottom:.5rem;
}
.kol-liste li::before{content:'·';position:absolute;left:0;color:var(--gold);font-size:1.3rem;line-height:1.2;}

/* ── HØJDEPUNKT — mørkt bånd, så det ene store trækplaster skiller sig ud ── */
.hoej{background:var(--charcoal);color:var(--cream);}
.hoej h2{color:var(--cream);}
.hoej .eyebrow{color:var(--gold-light);}
.hoej p{color:rgba(250,246,238,.82);}
.hoej-punkter{list-style:none;margin-top:2rem;}
.hoej-punkter li{
  font-family:'Cormorant Garamond',serif;font-size:1.12rem;line-height:1.7;
  color:rgba(250,246,238,.86);padding-left:1.6rem;position:relative;margin-bottom:.8rem;
}
.hoej-punkter li::before{content:'';position:absolute;left:0;top:.75em;width:10px;height:1px;background:var(--gold);}

/* ── PRAKTISKE DETALJER — fakta-grupper ──────────────────────────────────
   Hver gruppe er en kasse med guldstreg over overskriften. Linjer med et
   rør (|) sættes som etiket + værdi i to spalter; linjer uden bliver
   almindelige punkter. Så kan samme felt rumme både "Standardbillet | 10 €"
   og "Solide lukkede sko er påkrævet". */
.fakta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2.2rem;margin-top:3rem;}
.fakta-gruppe{
  background:var(--cream);border-top:2px solid var(--gold);
  padding:1.8rem 1.8rem 1.6rem;
}
.alt .fakta-gruppe{background:#fff;}
.fakta-gruppe h3{color:var(--wine);margin-bottom:1.1rem;}
.fakta-gruppe dl{margin:0;}
.fakta-linje{
  display:flex;gap:1rem;justify-content:space-between;align-items:baseline;
  padding:.5rem 0;border-bottom:1px solid rgba(184,138,30,.16);
}
.fakta-linje:last-child{border-bottom:none;}
.fakta-linje dt{
  font-family:'Manrope',sans-serif;font-size:.64rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-light);flex:1;
}
.fakta-linje dd{
  font-family:'Cormorant Garamond',serif;font-size:1.06rem;color:var(--text);
  text-align:right;flex:1;margin:0;
}
.fakta-punkt{
  font-family:'Cormorant Garamond',serif;font-size:1.06rem;line-height:1.62;
  color:var(--text-mid);padding:.4rem 0 .4rem 1.1rem;position:relative;
}
.fakta-punkt::before{content:'·';position:absolute;left:0;color:var(--gold);font-size:1.3rem;line-height:1.1;}

/* ── AFSTANDE ── */
.dist{display:flex;flex-wrap:wrap;gap:3rem;margin-top:2.4rem;}
.dist div{min-width:130px;}
.dist .n{font-family:'Cinzel',serif;font-size:1.7rem;color:var(--wine);display:block;}
.dist .l{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-light);margin-top:.4rem;display:block;}

/* ── FAQ ── */
.faq-item{border-bottom:1px solid rgba(184,138,30,.24);}
.faq-q{
  width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:1.5rem 2.5rem 1.5rem 0;position:relative;
  font-family:'Cinzel',serif;font-size:1.02rem;color:var(--text);letter-spacing:.02em;
}
.faq-q::after{content:'+';position:absolute;right:.2rem;top:50%;transform:translateY(-50%);color:var(--gold);font-family:'Manrope',sans-serif;font-size:1.2rem;}
.faq-item.open .faq-q::after{content:'–';}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease;}
.faq-item.open .faq-a{max-height:900px;}
.faq-a p{padding-bottom:1.6rem;}

/* ── FLERE SEVÆRDIGHEDER — intern krydslinkning ── */
.flere-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.6rem;margin-top:3rem;}
.flere-kort{
  position:relative;min-height:340px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  text-decoration:none;color:inherit;background:var(--charcoal);
  transition:transform .5s cubic-bezier(.23,1,.32,1),box-shadow .5s;
}
.flere-kort:hover,.flere-kort:focus-visible{transform:translateY(-5px);box-shadow:0 18px 52px rgba(44,35,24,.22);}
.flere-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.flere-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(44,35,24,.1) 0%,rgba(44,35,24,.35) 45%,rgba(44,35,24,.9) 100%);}
.flere-accent{position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold);z-index:2;}
.flere-indhold{position:relative;z-index:2;padding:1.8rem 1.6rem;}
.flere-indhold h3{color:var(--gold-pale);margin-bottom:.5rem;}
.flere-indhold p{color:rgba(250,246,238,.8);font-size:1rem;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.flere-afstand{
  font-family:'Manrope',sans-serif;font-size:.58rem;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(250,246,238,.6);margin-top:.9rem;display:block;
}

/* ── CTA ── */
.cta-band{background:var(--charcoal);color:var(--cream);text-align:center;}
.cta-band h2{color:var(--cream);}
.cta-band p{color:rgba(250,246,238,.8);}
.btn-wine{
  display:inline-block;margin-top:2.2rem;
  font-family:'Manrope',sans-serif;font-size:.7rem;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  color:#fff;background:var(--wine);padding:1rem 2.5rem;
  text-decoration:none;transition:background .3s;
}
.btn-wine:hover,.btn-wine:focus-visible{background:var(--wine-light);}
.nav-links .lang-btn{
  border-radius:0;font-family:'Manrope',sans-serif;
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.35rem .7rem;border:none;cursor:pointer;
  display:inline-block;text-decoration:none;line-height:1.2;
}
.nav-links .lang-btn.lang-btn-active{background:var(--wine);color:#fff !important;}
.nav-links .lang-btn.lang-btn-inactive{background:transparent;color:var(--wine) !important;}
.nav-links .lang-switcher{display:inline-flex;flex:0 0 auto;}
.nav-burger span{transform-origin:center;}
.nav-burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.nav-burger.open span:nth-child(2){opacity:0;}
.nav-burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

/* ── FOOTER ── */
footer{background:var(--charcoal);color:rgba(250,246,238,.72);padding:3rem 4rem;border-top:1px solid rgba(184,138,30,.2);}
.footer-bottom{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:1.6rem;flex-wrap:wrap;align-items:center;font-size:.68rem;letter-spacing:.08em;}
.footer-bottom a{color:rgba(250,246,238,.72);text-decoration:none;}
.footer-bottom a:hover,.footer-bottom a:focus-visible{color:var(--gold-light);}
.footer-bottom p{font-family:'Manrope',sans-serif;font-size:.68rem;color:rgba(250,246,238,.55);}

/* ── FEJLTILSTAND — ukendt slug ── */
.ikke-fundet{min-height:70svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:8rem 2rem;}

/* ── TILGÆNGELIGHED ── */
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
  html{scroll-behavior:auto;}
}

/* ── MOBIL (kun i media query — påvirker aldrig desktop) ── */
@media (max-width:900px){
  nav{padding:1rem 1.5rem;}
  .nav-burger{display:flex;}
  .nav-back{display:none;}
  .nav-links{
    position:fixed;top:0;right:0;z-index:9995;
    height:100vh;height:100svh;
    width:min(82vw,340px);
    flex-direction:column;align-items:stretch;justify-content:flex-start;
    gap:0;padding:6rem 2rem 6rem;
    background:rgba(250,246,238,.99);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-left:1px solid rgba(184,138,30,.2);
    box-shadow:-16px 0 48px rgba(44,35,24,.16);
    overflow-y:auto;overscroll-behavior:contain;
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.23,1,.32,1);
  }
  .nav-links.open{transform:translateX(0);}
  .nav-links li{border-bottom:1px solid rgba(184,138,30,.14);}

  if (m && m[1]) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }

function svSC(key, fallback) {
  const v = svData[svLang === 'en' ? key + '_en' : key];

function svSet(id, val) { const el = document.getElementById(id); if (el) el.innerHTML = val || ''; }

  const raa = svData[key];

// Og efterstillet tegnsætning hører til sætningen, ikke til adressen — et
// punktum efter en URL skal ikke med i href'en.
// Kendte topdomæner. En allowlist frem for et generisk mønster, fordi dansk
// tekst er fuld af punktummer: "kl. 07.40", "ca. 10 €", "bl.a.". Kun rigtige
// domæneendelser bliver til links, så tal og forkortelser går fri.
const SV_TLD = '(?:com|net|org|info|io|eu|dk|es|se|no|fi|de|fr|it|nl|uk|be|at|ch|pl|pt|ie|' +
               'travel|guide|tours|shop|app|site|online|blog|club|life)';

// Ét mønster fanger e-mail, fuld adresse, www-adresse og bart domæne.
// Tegnet foran fanges med, så vi kan afvise adresser midt i et ord og
// domænedelen af en e-mail (uden lookbehind, som ældre Safari ikke kan).
const SV_LINK = new RegExp(
  '(^|[^\\w@\\/.-])(' +
    '[a-z0-9._%+-]+@[a-z0-9-]+(?:\\.[a-z0-9-]+)+' +
    '|https?:\\/\\/[^\\s<>"\']+' +
    '|www\\.[a-z0-9-]+(?:\\.[a-z0-9-]+)+[^\\s<>"\']*' +
    '|[a-z0-9][a-z0-9-]*(?:\\.[a-z0-9-]+)*\\.' + SV_TLD + '(?:\\/[^\\s<>"\']*)?' +
  ')', 'gi');

// Adresser skrevet i et tekstfelt bliver automatisk til links, der åbner i
// et nyt faneblad. Erik skriver bare caminitodelrey.info — han skal hverken
// skrive HTML eller huske et www. foran.
//
// Tre ting passes på: der linkes kun i fri tekst, aldrig inde i et tag eller
// i et <a> Erik selv har skrevet (ellers ville vi bygge links inde i links).
// Efterstillet tegnsætning hører til sætningen, ikke adressen — et punktum
// efter en adresse skal ikke med i href'en. Og e-mail bliver til mailto
// uden target, så den åbner i mailprogrammet i stedet for et tomt faneblad.
function svLinkify(t) {
  if (!t || String(t).indexOf('.') === -1) return t || '';
  let iLink = false;
  return String(t).split(/(<[^>]*>)/).map(function (del, i) {
    if (i % 2 === 1) {                       // selve tagget
      if (/^<a[\s>]/i.test(del)) iLink = true;
      else if (/^<\/a>/i.test(del)) iLink = false;
      return del;
    }
    if (iLink) return del;                   // tekst inde i et link, Erik selv har lavet
    return del.replace(SV_LINK, function (hele, foran, adr) {
      let hale = '';
      const tegn = adr.match(/[.,;:!?)\]]+$/);
      if (tegn) { hale = tegn[0]; adr = adr.slice(0, adr.length - hale.length); }
      if (!adr) return hele;
      const erMail = adr.indexOf('@') !== -1;
      const href = erMail ? 'mailto:' + adr
                 : (/^https?:\/\//i.test(adr) ? adr : 'https://' + adr);
      // Vist tekst = præcis det Erik skrev, minus et https:// der kun støjer
      const vist = adr.replace(/^https?:\/\//i, '');
      const maal = erMail ? '' : ' target="_blank" rel="noopener noreferrer"';
      return foran + '<a href="' + href + '"' + maal + '>' + vist + '</a>' + hale;
    });
  }).join('');
}

// Linjer i en fakta-gruppe: "Etiket | Værdi" bliver til to spalter,
// linjer uden rør bliver almindelige punkter.
function svFaktaLinjer(raa) {
  return String(raa || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf('|');
    if (i === -1) return '<div class="fakta-punkt">' + svLinkify(l) + '</div>';
    return '<div class="fakta-linje"><dt>' + l.slice(0, i).trim() + '</dt><dd>' +
      svLinkify(l.slice(i + 1).trim()) + '</dd></div>';
  }).join('');
}

// Interne links skal pege på /en/… når man er på engelsk
function svSvUrlPraefiks() { return svLang === 'en' ? '/en' : ''; }

function byggSvNav() {
  const ul = document.getElementById('navLinks');
  const holder = document.getElementById('sv_nav_links_holder');
  if (!ul || !holder) return;
  Array.prototype.slice.call(ul.querySelectorAll('.sv-navlink')).forEach(el => el.remove());
  let links = [];
  try {
    const raa = JSON.parse(svData.nav_links || '[]');
    if (Array.isArray(raa)) links = raa.map(l => ({
      tekst: (svLang === 'en' ? (l.tekst_en || l.tekst) : l.tekst) || '',
      link: l.link || '', vis: l.vis
    }));
  } catch (e) { links = []; }
  links = links.filter(l => l.vis !== '0' && l.tekst && l.link);
  holder.style.display = links.length ? 'none' : '';
  links.forEach(l => {
    const li = document.createElement('li');
    li.className = 'sv-navlink';
    const a = document.createElement('a');
    // Ankre bliver stående; interne stier får /en foran på engelsk
    a.setAttribute('href', l.link.charAt(0) === '/' ? svSvUrlPraefiks() + l.link : l.link);
    a.textContent = l.tekst;
    li.appendChild(a);
    ul.insertBefore(li, holder);
  });
  const ui = SV_UI[svLang] || SV_UI.da;
  const back = document.getElementById('sv_nav_back');
  if (back) { back.textContent = svSC('nav_back') || ui.tilbage; back.setAttribute('href', svSvUrlPraefiks() + '/'); }
  const logo = document.getElementById('sv_logo_link');
  if (logo) logo.setAttribute('href', svSvUrlPraefiks() + '/');
}

function byggSvFooter() {
  const c = document.getElementById('sv_footer_links');
  if (!c) return;
  const ui = SV_UI[svLang] || SV_UI.da;
  const p = svSvUrlPraefiks();
  c.innerHTML =
    '<a href="' + p + '/udlejning">' + svEsc(ui.udlejning) + '</a>' +
    '<a href="' + p + '/kontakt">' + svEsc(ui.kontakt) + '</a>' +
    '<a href="' + p + '/privacidad">' + svEsc(ui.privatliv) + '</a>' +
    '<a href="' + p + '/">' + svEsc(ui.hjem) + '</a>';
}

// Op til fem billeder pr. stribe. Er en stribe tom, skjules den helt.
function byggSvStriber() {
  ['strip1', 'strip2', 'strip3'].forEach(function (id) {
    const sec = document.getElementById(id);
    if (!sec) return;
    const grid = sec.querySelector('.foto-stribe-grid');
    if (!grid) return;
    let billeder = svData[id + '_images'];
    if (typeof billeder === 'string') { try { billeder = JSON.parse(billeder); } catch (e) { billeder = null; } }
    billeder = Array.isArray(billeder) ? billeder.filter(Boolean).slice(0, 5) : [];
    const luftTop = parseFloat(svData[id + '_top']);
    const luftBund = parseFloat(svData[id + '_bund']);
    sec.style.setProperty('--stribe-top', (isNaN(luftTop) ? 2 : luftTop) + 'rem');
    sec.style.setProperty('--stribe-bund', (isNaN(luftBund) ? 2 : luftBund) + 'rem');
    if (!billeder.length) { sec.style.display = 'none'; grid.innerHTML = ''; return; }
    // Felterne holder samme størrelse uanset antal: fire billeder fylder
    // 4/5 af bredden i stedet for at blive strukket ud til fem felters plads.
    grid.style.gridTemplateColumns = 'repeat(' + billeder.length + ',1fr)';
    grid.style.maxWidth = (billeder.length / 5 * 100) + '%';
    grid.innerHTML = billeder.map(function (u, i) {
      return '<div class="stribe-felt">' +
        '<span class="stribe-accent" style="background:' + SV_STRIBE_FARVER[i % SV_STRIBE_FARVER.length] + ';"></span>' +
        '<img src="' + svEsc(u) + '" alt="Castillo del Alma" loading="lazy">' +
      '</div>';
    }).join('');
    sec.style.display = '';
  });
}

// Krydslinks til de øvrige seværdigheder — intern linkning, som både gæster
// og Google har glæde af. Sektionen skjules, hvis der ikke er andre endnu.
function byggSvFlere() {
  const sec = document.getElementById('sec-flere');
  const grid = document.getElementById('sv_flere_grid');
  if (!sec || !grid) return;
  if (!svAndre.length) { sec.style.display = 'none'; grid.innerHTML = ''; return; }
  const p = svSvUrlPraefiks();
  grid.innerHTML = svAndre.slice(0, 6).map(function (r) {
    const ind = r.indhold || {};
    const titel = (svLang === 'en' && ind.hero_h1_en) ? ind.hero_h1_en : (ind.hero_h1 || r.titel || r.slug);
    const tekst = (svLang === 'en' && ind.hero_lede_en) ? ind.hero_lede_en : (ind.hero_lede || '');
    const eyebrow = (svLang === 'en' && ind.hero_eyebrow_en) ? ind.hero_eyebrow_en : (ind.hero_eyebrow || '');
    const bg = ind.hero_image || ind.intro_image || '';
    return '<a class="flere-kort" href="' + p + '/sevaerdigheder/' + encodeURIComponent(r.slug) + '">' +
      (bg ? '<div class="flere-bg" style="background-image:url(\'' + svEsc(bg) + '\');"></div>' : '') +
      '<div class="flere-fade"></div><div class="flere-accent"></div>' +
      '<div class="flere-indhold"><h3>' + svEsc(svRent(titel)) + '</h3>' +
      '<p>' + svEsc(svRent(tekst)) + '</p>' +
      (eyebrow ? '<span class="flere-afstand">' + svEsc(svRent(eyebrow)) + '</span>' : '') +
      '</div></a>';
  }).join('');
  sec.style.display = '';
}

function applySvSektionOrden() {
  let orden = [];
  try { orden = JSON.parse(svData.sektion_orden || '[]'); } catch (e) { orden = []; }
  if (!Array.isArray(orden) || !orden.length) return;
  orden = orden.filter(id => SV_STANDARD_ORDEN.indexOf(id) !== -1);
  SV_STANDARD_ORDEN.forEach(function (id, idx) {
    if (orden.indexOf(id) !== -1) return;
    let hvor = orden.length;
    for (let k = idx - 1; k >= 0; k--) {
      const pos = orden.indexOf(SV_STANDARD_ORDEN[k]);
      if (pos !== -1) { hvor = pos + 1; break; }
    }
    orden.splice(hvor, 0, id);
  });
  const anker = document.getElementById('sv_side');
  if (!anker) return;
  orden.forEach(function (id) {
    const sec = document.getElementById(id);
    if (sec) anker.appendChild(sec);
  });
}

function applySvSynlighed() {
  Object.keys(SV_SEKTIONER).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (svData[SV_SEKTIONER[id]] === '0') { el.style.display = 'none'; return; }
    // Striber og krydslinks styrer selv, om de har noget at vise
    if (id === 'strip1' || id === 'strip2' || id === 'strip3' || id === 'sec-flere') return;
    // De ekstra historie-sektioner vises kun, når de har indhold. Ellers ville
    // hver seværdighed få fire tomme sektioner, den ikke bruger.
    if (/^sec-historie5[1-4]$/.test(id)) {
      const k = id.replace('sec-', '');
      const harIndhold = !!(svSC(k + '_h2') || svSC(k + '_text') || svData[k + '_image']);
      el.style.display = harIndhold ? '' : 'none';
      return;
    }
    el.style.display = '';
  });
}

function svUrl(sprog, slug) {
  return 'https://castillodelalma.es' + (sprog === 'en' ? '/en' : '') +
         '/sevaerdigheder/' + encodeURIComponent(slug || (svRaekke && svRaekke.slug) || '');
}

function applySvMeta() {
  const paaEn = svLang === 'en';
  const url = svUrl(paaEn ? 'en' : 'da');
  const titel = svSC('seo_title') || svRent(svSC('hero_h1')) + ' — Castillo del Alma';
  const desc  = svRent(svSC('seo_desc') || svSC('hero_lede'));
  const img   = svData.social_image || svData.hero_image || 'https://castillodelalma.es/img/castillo-del-alma-social-1200.jpg';
  document.title = titel;
  function m(attr, key, val) {
    if (!val) return;
    let el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute('content', val);
  }
  m('name', 'description', desc);
  m('property', 'og:title', titel);
  m('property', 'og:description', desc);
  m('property', 'og:url', url);
  m('property', 'og:image', img);
  m('property', 'og:locale', paaEn ? 'en_US' : 'da_DK');
  m('name', 'twitter:title', titel);
  m('name', 'twitter:description', desc);
  m('name', 'twitter:image', img);
  let c = document.head.querySelector('link[rel="canonical"]');
  if (!c) { c = document.createElement('link'); c.setAttribute('rel', 'canonical'); document.head.appendChild(c); }
  c.setAttribute('href', url);
  function alt(hl, href) {
    let el = document.head.querySelector('link[rel="alternate"][hreflang="' + hl + '"]');
    if (!el) { el = document.createElement('link'); el.setAttribute('rel', 'alternate'); el.setAttribute('hreflang', hl); document.head.appendChild(el); }
    el.setAttribute('href', href);
  }
  alt('da', svUrl('da')); alt('en', svUrl('en')); alt('x-default', svUrl('da'));
  // Sprogknapperne peger på den rigtige adresse, også ved højreklik
  const bDa = document.getElementById('sv-btn-da'), bEn = document.getElementById('sv-btn-en');
  if (bDa) bDa.setAttribute('href', svUrl('da'));
  if (bEn) bEn.setAttribute('href', svUrl('en'));
}

// Struktureret data: TouristAttraction giver Google noget at arbejde med ud
// over ren tekst, og FAQ-schemaet holdes altid i takt med spørgsmålene på siden.
function byggSvJsonLd() {
  const el = document.getElementById('sv_jsonld');
  if (!el) return;
  const url = svUrl(svLang === 'en' ? 'en' : 'da');
  const faq = svListe('faq_items', 2);
  const navn = svRent(svSC('hero_h1'));
  const graf = [
    { '@type': 'WebPage', '@id': url + '#page', url: url, name: svSC('seo_title') || navn,
      inLanguage: svLang, description: svRent(svSC('seo_desc') || svSC('hero_lede')),
      isPartOf: { '@type': 'WebSite', name: 'Castillo del Alma', url: 'https://castillodelalma.es' } },
    { '@type': 'TouristAttraction', name: navn,
      description: svRent(svSC('intro_lede') || svSC('hero_lede')),
      image: svData.hero_image || undefined,
      url: url,
      isAccessibleForFree: undefined,
      address: { '@type': 'PostalAddress', addressRegion: 'Andalucía', addressCountry: 'ES' } },
    { '@type': 'BreadcrumbList', itemListElement: [
      { '@type': 'ListItem', position: 1, name: svLang === 'en' ? 'Home' : 'Forsiden',
        item: 'https://castillodelalma.es' + (svLang === 'en' ? '/en/' : '/') },
      { '@type': 'ListItem', position: 2, name: navn, item: url }
    ] }
  ];
  if (faq.length) graf.push({ '@type': 'FAQPage', mainEntity: faq.map(r => ({
    '@type': 'Question', name: svRent(r[0]),
    acceptedAnswer: { '@type': 'Answer', text: svRent(r[1]) }
  })) });
  el.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graf });
}

function setSvLang(lang) {
  svLang = (lang === 'en') ? 'en' : 'da';
  const slug = (svRaekke && svRaekke.slug) || svSlugFraUrl();
  try {
    const sti = '/sevaerdigheder/' + encodeURIComponent(slug);
    history.replaceState(null, '', (svLang === 'en' ? '/en' : '') + sti + location.hash);
  } catch (e) { /* replaceState utilgængelig → sproget skifter stadig */ }
  const bDa = document.getElementById('sv-btn-da'), bEn = document.getElementById('sv-btn-en');
  if (bDa) { bDa.classList.toggle('lang-btn-active', svLang === 'da'); bDa.classList.toggle('lang-btn-inactive', svLang !== 'da'); }
  if (bEn) { bEn.classList.toggle('lang-btn-active', svLang === 'en'); bEn.classList.toggle('lang-btn-inactive', svLang !== 'en'); }
  if (svRaekke) applySvContent(); else visSvIkkeFundet();
}

// Samme sprogvalg som resten af sitet: adressen vinder, derefter geo, derefter browser
async function bestemSvStartsprog() {
  if (svPaaEngelskSti()) return 'en';
  try {
    const c = sessionStorage.getItem('cda_geo_lang');
    if (c === 'da' || c === 'en') return c;
  } catch (e) { /* sessionStorage utilgængelig */ }
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch('/.netlify/functions/geo-lang', { signal: ctrl.signal });
    clearTimeout(t);
    if (res.ok) {
      const geo = await res.json();
      if (geo && (geo.lang === 'da' || geo.lang === 'en')) {
        try { sessionStorage.setItem('cda_geo_lang', geo.lang); } catch (e) {}
        return geo.lang;
      }
    }
  } catch (e) { /* geo utilgængelig → browsersprog nedenfor */ }
  try {
    const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language])
      .filter(Boolean).map(l => l.toLowerCase());
    if (langs.some(l => l.startsWith('da'))) return 'da';
    return langs.length ? 'en' : 'da';
  } catch (e) { return 'da'; }
}

async function loadSvIndhold() {
  const slug = svSlugFraUrl();
  let start = 'da';
  const svar = await Promise.allSettled([
    svSb ? svSb.from('sevaerdigheder').select('slug,titel,titel_en,aktiv,sort_orden,indhold').eq('aktiv', true).order('sort_orden', { ascending: true })
         : Promise.resolve({ data: [] }),
    bestemSvStartsprog()
  ]);
  if (svar[1].status === 'fulfilled') start = svar[1].value;

  let raekker = [];
  if (svar[0].status === 'fulfilled' && svar[0].value && svar[0].value.data) {
    raekker = svar[0].value.data || [];
  } else if (svar[0].status === 'rejected') {
    console.warn('sevaerdigheder kunne ikke hentes (er tabellen oprettet?):', svar[0].reason);
  }

  svRaekke = raekker.find(r => r && r.slug === slug) || null;
  svAndre  = raekker.filter(r => r && r.slug !== slug);

  if (!svRaekke) {
    svLang = start;
    visSvIkkeFundet();
    return;
  }
  let ind = svRaekke.indhold;
  if (typeof ind === 'string') { try { ind = JSON.parse(ind); } catch (e) { ind = {}; } }
  svData = ind && typeof ind === 'object' ? ind : {};
  const side = document.getElementById('sv_side');
  const nf = document.getElementById('sv_ikke_fundet');
  if (side) side.style.display = '';
  if (nf) nf.style.display = 'none';
  setSvLang(start);
}

function bindSvFaq() {
  document.querySelectorAll('.faq-q').forEach(function (btn) {
    if (btn.dataset.svbundet) return;
    btn.dataset.svbundet = '1';
    btn.addEventListener('click', function () {
      const item = btn.closest('.faq-item');
      const aaben = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', aaben ? 'true' : 'false');
    });
  });
}
</script>

<script>
// ── MOBILMENU — samme opførsel som på de øvrige sider ──
(function () {
  var burger = document.getElementById('navBurger');
  var links = document.getElementById('navLinks');
  var backdrop = document.getElementById('navBackdrop');
  if (!burger || !links || !backdrop) return;
  function luk() {
    links.classList.remove('open');
    backdrop.classList.remove('open');
    burger.classList.remove('open');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Åbn menu');
  }
  burger.addEventListener('click', function () {
    var aaben = links.classList.toggle('open');
    backdrop.classList.toggle('open', aaben);
    burger.classList.toggle('open', aaben);
    burger.setAttribute('aria-expanded', aaben ? 'true' : 'false');
    burger.setAttribute('aria-label', aaben ? 'Luk menu' : 'Åbn menu');
  });
  backdrop.addEventListener('click', luk);
  links.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.lang-switcher')) return;
    if (e.target.tagName === 'A') luk();
  });
})();

loadSvIndhold();
</script>
