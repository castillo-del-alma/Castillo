[build]
  functions = "netlify/functions"
  command = "cd netlify/functions && npm install"

# Pas-påmindelse: kører dagligt kl. 07:00 UTC (09:00 spansk sommertid)
[functions."pas-reminder"]
  schedule = "0 7 * * *"

# Forum-livscyklus: åbner fora 7 dage før ankomst, sender digest-mails og
# sletter arkiverede fora 30 dage efter arkivering. Kører dagligt kl. 08:00 UTC.
[functions."forum-lifecycle"]
  schedule = "0 8 * * *"

# HTML må ALDRIG caches i browseren. Uden dette genbruger browseren den gamle
# fil efter et deploy, og man skal trykke hard refresh for at se ændringer.
# Billeder, fonte, video osv. caches stadig som normalt.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin-anmeldelser.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_KEY,RESEND_API_KEY,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,FORUM_ADMIN_KEY"
