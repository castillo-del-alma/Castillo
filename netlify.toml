[build]
  functions = "netlify/functions"
  command = "cd netlify/functions && npm install"

[[headers]]
  for = "/admin-anmeldelser.html"
  [headers.values]
    X-Frame-Options = "DENY"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,RESEND_API_KEY,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET"
