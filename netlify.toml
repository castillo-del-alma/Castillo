[build]
  functions = "netlify/functions"
  command = "cd netlify/functions && npm install"

# Pas-påmindelse: kører dagligt kl. 07:00 UTC (09:00 spansk sommertid)
[functions."pas-reminder"]
  schedule = "0 7 * * *"

# Forum-livscyklus: åbner fora 7 dage før ankomst, sender digest-mails og
# sletter arkiverede fora 30 dage efter arkivering. Kører dagligt kl. 08:00 UTC.
[functions."forum-lifecycle"]
  schedule = "0 8 * * *"

# Ugentlig holdstatus til jer selv: mandag kl. 06:00 UTC (08:00 spansk tid)
[functions."holdstatus"]
  schedule = "0 6 * * 1"

# ── Dynamisk sitemap: /sitemap.xml genereres af Netlify-funktion, som
# automatisk medtager alle aktive retreats (DA + EN) fra Supabase
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# ── RENE RETREAT-ADRESSER ────────────────────────────────────────────────
# /retreat/<slug> i stedet for /retreat?slug=<slug>.
# Slug'en er uændret — den er stadig præcis den, der oprettes i admin.
# De gamle adresser sendes videre med 301, så delte links og indekserede
# sider bevarer deres værdi. Rækkefølgen er vigtig: query-reglerne skal stå
# før både /en/retreat og /en/*, ellers vinder de forkerte regler.

[[redirects]]
  from = "/retreat"
  query = { slug = ":slug" }
  to = "/retreat/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/retreat.html"
  query = { slug = ":slug" }
  to = "/retreat/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/en/retreat"
  query = { slug = ":slug" }
  to = "/en/retreat/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/en/retreat.html"
  query = { slug = ":slug" }
  to = "/en/retreat/:slug"
  status = 301
  force = true

# Selve visningen: begge sprogstier serverer samme skabelon (status 200 =
# rewrite, adressen i browseren bevares)
[[redirects]]
  from = "/retreat/*"
  to = "/retreat.html"
  status = 200

[[redirects]]
  from = "/en/retreat/*"
  to = "/retreat.html"
  status = 200

# ── SEVÆRDIGHEDER ────────────────────────────────────────────────────────
# /sevaerdigheder/<slug> i stedet for /sevaerdighed.html?slug=<slug>.
# Samme opbygning som retreat-adresserne ovenfor: query-reglerne først, så
# de gamle former sendes videre med 301, derefter selve visningen. Begge
# sprogstier serverer samme skabelon, som selv opdager /en/ i adressen.
# Reglerne SKAL stå før /en/*, ellers vinder catch-all'en.

[[redirects]]
  from = "/sevaerdighed.html"
  query = { slug = ":slug" }
  to = "/sevaerdigheder/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/en/sevaerdighed.html"
  query = { slug = ":slug" }
  to = "/en/sevaerdigheder/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/sevaerdigheder/*"
  to = "/sevaerdighed.html"
  status = 200

[[redirects]]
  from = "/en/sevaerdigheder/*"
  to = "/sevaerdighed.html"
  status = 200

# ── Engelske SEO-adresser (/en/) ─────────────────────────────────────────
# Samme HTML-filer serveres på /en/-stier; siderne opdager selv /en/ i
# adressen og starter på engelsk med engelsk titel/meta/canonical.
# Rækkefølgen er vigtig: første regel der matcher, vinder.

# Den gamle adresse nåede at være live — 301 så intet indekseret går tabt
[[redirects]]
  from = "/en/gay-retreat-spain"
  to = "/en/gay-retreat-malaga-spain"
  status = 301
  force = true

# Landingssiden er nu tosproget som resten af sitet: dansk på
# /gay-retreat-malaga-spain, engelsk på /en/gay-retreat-malaga-spain.
# Skal stå før /en/* så adressen bevares i browseren.
[[redirects]]
  from = "/en/gay-retreat-malaga-spain"
  to = "/gay-retreat-malaga-spain.html"
  status = 200

# Torremolinos-guiden er tosproget som resten af sitet: dansk på
# /gay-torremolinos, engelsk på /en/gay-torremolinos.
# Skal stå før /en/* så adressen bevares i browseren.
[[redirects]]
  from = "/en/gay-torremolinos"
  to = "/gay-torremolinos.html"
  status = 200

# ── ENGELSK SLUG FOR UDLEJNINGSSIDEN ────────────────────────────────────
# "udlejning" betyder intet for en engelsk søgning. Den engelske udgave ligger
# derfor på /en/venue-hire. Den danske adresse er uændret.
# Rækkefølgen er kritisk: begge regler SKAL stå før /en/*, ellers omskriver
# catch-all'en /en/venue-hire til /venue-hire, som ikke findes → 404.

# Gammel engelsk adresse videre med 301, så intet indekseret eller delt går tabt.
# Fanger også de interne relative links (…/en/udlejning.html) fra andre sider.
[[redirects]]
  from = "/en/udlejning"
  to = "/en/venue-hire"
  status = 301
  force = true

[[redirects]]
  from = "/en/udlejning.html"
  to = "/en/venue-hire"
  status = 301
  force = true

# Selve visningen: samme fil som den danske side (status 200 = rewrite,
# adressen i browseren bevares)
[[redirects]]
  from = "/en/venue-hire"
  to = "/udlejning.html"
  status = 200

# /en → /en/ (én kanonisk engelsk forside-adresse)
[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

# /en/ viser forsiden (index.html)
[[redirects]]
  from = "/en/"
  to = "/index.html"
  status = 200

# /en/retreat viser retreat-skabelonen (?slug= følger automatisk med)
[[redirects]]
  from = "/en/retreat"
  to = "/retreat.html"
  status = 200

# Alt andet under /en/ (billeder, fonte, relative links som retreat.html?slug=…)
# peger på samme fil i roden — så intet giver 404 på /en/-stier
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 200

# HTML må ALDRIG caches i browseren. Uden dette genbruger browseren den gamle
# fil efter et deploy, og man skal trykke hard refresh for at se ændringer.
# Billeder, fonte, video osv. caches stadig som normalt.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin-anmeldelser.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_KEY,RESEND_API_KEY,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,FORUM_ADMIN_KEY,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,ADMIN_EMAIL"

# ── SOCIAL META (Edge Function) ──
# Social-robotter (Facebook, WhatsApp, LinkedIn …) kører ikke JS og ser kun
# fallback-meta. Edge-funktionen indsætter retreat-specifikke og engelske
# meta-tags for robotter; almindelige besøgende passerer uberørt igennem.
[[edge_functions]]
  path = "/retreat"
  function = "social-meta"
[[edge_functions]]
  path = "/retreat/*"
  function = "social-meta"
[[edge_functions]]
  path = "/retreat.html"
  function = "social-meta"
[[edge_functions]]
  path = "/en/retreat"
  function = "social-meta"
[[edge_functions]]
  path = "/en/retreat/*"
  function = "social-meta"
[[edge_functions]]
  path = "/en/retreat.html"
  function = "social-meta"
[[edge_functions]]
  path = "/gay-retreat-malaga-spain"
  function = "social-meta"
[[edge_functions]]
  path = "/gay-retreat-malaga-spain.html"
  function = "social-meta"
[[edge_functions]]
  path = "/en/gay-retreat-malaga-spain"
  function = "social-meta"
[[edge_functions]]
  path = "/gay-torremolinos"
  function = "social-meta"
[[edge_functions]]
  path = "/gay-torremolinos.html"
  function = "social-meta"
[[edge_functions]]
  path = "/en/gay-torremolinos"
  function = "social-meta"
[[edge_functions]]
  path = "/en"
  function = "social-meta"
[[edge_functions]]
  path = "/en/"
  function = "social-meta"
[[edge_functions]]
  path = "/"
  function = "social-meta"
[[edge_functions]]
  path = "/index.html"
  function = "social-meta"

# Tosprogede undersider: uden disse ser Googlebot dansk HTML med canonical →
# den danske adresse på /en/-stien, og den engelske version indekseres aldrig.
[[edge_functions]]
  path = "/udlejning"
  function = "social-meta"
[[edge_functions]]
  path = "/udlejning.html"
  function = "social-meta"
[[edge_functions]]
  path = "/en/udlejning"
  function = "social-meta"
[[edge_functions]]
  path = "/en/venue-hire"
  function = "social-meta"
[[edge_functions]]
  path = "/ejendommen"
  function = "social-meta"
[[edge_functions]]
  path = "/ejendommen.html"
  function = "social-meta"
[[edge_functions]]
  path = "/en/ejendommen"
  function = "social-meta"
[[edge_functions]]
  path = "/kontakt"
  function = "social-meta"
[[edge_functions]]
  path = "/kontakt.html"
  function = "social-meta"
[[edge_functions]]
  path = "/en/kontakt"
  function = "social-meta"
