<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf6ee">
<title>Forum — Castillo del Alma</title>
<link rel="manifest" href="forum.webmanifest">
<link rel="apple-touch-icon" href="img/forum-icon-192.png">
<link rel="icon" href="img/forum-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CDA Forum">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--cream:#faf6ee;--beige:#f0e8d5;--sand:#d8c49c;--charcoal:#241c12;--text-mid:#4a3d2a;--text-light:#6b5c47;--wine:#7a1f35;--gold:#8f6a12;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Manrope',sans-serif;background:var(--cream);color:var(--charcoal);overflow:hidden;}

/* ---------- Skelet ---------- */
.app{display:flex;flex-direction:column;height:100dvh;max-width:780px;margin:0 auto;background:var(--cream);}

.f-header{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--sand);padding:.9rem 1.2rem;display:flex;align-items:center;gap:.9rem;}
.f-header img{height:30px;width:auto;flex:0 0 auto;}
.f-head-txt{min-width:0;flex:1;}
.f-title{font-family:'Cinzel',serif;font-weight:500;font-size:1.02rem;letter-spacing:.06em;color:var(--charcoal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-sub{font-size:.64rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text-mid);margin-top:.2rem;}
.f-sub.aktiv{color:#4f5a24;}
.f-sub.arkiveret{color:var(--gold);}

/* Klokke: lyd + notifikationer */
.f-bell{flex:0 0 auto;background:none;border:1px solid var(--sand);width:38px;height:38px;font-size:1.05rem;line-height:1;cursor:pointer;color:var(--text-mid);display:flex;align-items:center;justify-content:center;padding:0;}
.f-bell:hover{border-color:var(--gold);}
.f-bell.on{border-color:var(--gold);background:rgba(184,138,30,.12);}

/* ---------- Beskeder ---------- */
.f-stream{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:1.2rem 1rem 1.5rem;}

.f-welcome{background:rgba(184,138,30,.08);border:1px solid rgba(184,138,30,.22);padding:1rem 1.1rem;margin-bottom:1.5rem;}
.f-welcome .lbl{font-size:.62rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
.f-welcome .txt{font-family:'Cormorant Garamond',serif;font-size:1.2rem;line-height:1.6;color:var(--charcoal);}
.f-welcome .txt b{font-weight:700;color:var(--charcoal);}

.f-day{text-align:center;margin:1.4rem 0 1rem;}
.f-day span{font-size:.62rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mid);background:var(--beige);padding:.3rem .9rem;}

.f-msg{display:flex;gap:.6rem;margin-bottom:.9rem;align-items:flex-end;}
.f-msg.mine{flex-direction:row-reverse;}

.f-avatar{flex:0 0 auto;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;letter-spacing:.02em;color:#fff;text-transform:uppercase;}
.f-avatar img{width:100%;height:100%;object-fit:cover;}
.f-avatar.hidden{visibility:hidden;}

.f-bubble-wrap{max-width:76%;min-width:0;}
.f-name{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid);margin:0 0 .3rem .2rem;}
.f-msg.mine .f-name{text-align:right;margin:0 .2rem .25rem 0;}
.f-name .mod{color:var(--gold);}

.f-bubble{background:#fff;border:1px solid var(--sand);padding:.7rem .9rem;position:relative;}
/* Moderator (kun når det IKKE er min egen besked): gylden baggrund, mørk tekst */
.f-msg.mod:not(.mine) .f-bubble{background:rgba(184,138,30,.16);border-color:rgba(143,106,18,.45);}
/* Egne beskeder vinder altid — også når jeg selv er moderator */
.f-msg.mine .f-bubble{background:var(--wine);border-color:var(--wine);}
.f-msg.mine .f-body{color:#fff;}
.f-body{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.25rem;line-height:1.5;color:var(--charcoal);white-space:pre-wrap;word-break:break-word;}
.f-bubble a{color:inherit;text-decoration:underline;}
.f-img{display:block;max-width:100%;margin-top:.4rem;cursor:pointer;border:1px solid rgba(0,0,0,.06);}
.f-msg .f-body:empty{display:none;}
.f-time{font-size:.64rem;color:var(--text-light);margin-top:.35rem;text-align:right;}
.f-msg.mine .f-time{color:rgba(255,255,255,.75);}
.f-del{background:none;border:none;font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-light);cursor:pointer;padding:.25rem 0 0;}
.f-msg.mine .f-del{color:rgba(255,255,255,.75);}
.f-del:hover{color:var(--wine);}
.f-msg.mine .f-del:hover{color:#fff;}
.f-deleted .f-bubble{background:transparent!important;border-style:dashed;color:var(--text-light)!important;}
.f-deleted .f-body{font-style:italic;font-size:1.05rem;color:var(--text-light)!important;}

/* ---------- Inputbjælke ---------- */
.f-input{flex:0 0 auto;background:#fff;border-top:1px solid var(--sand);padding:.7rem .8rem calc(.7rem + env(safe-area-inset-bottom));}
.f-preview{display:none;align-items:center;gap:.6rem;margin-bottom:.6rem;padding:.4rem;background:var(--cream);border:1px solid var(--beige);}
.f-preview.on{display:flex;}
.f-preview img{width:46px;height:46px;object-fit:cover;}
.f-preview .nm{flex:1;font-size:.68rem;color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f-preview button{background:none;border:none;color:var(--wine);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}

.f-row{display:flex;align-items:flex-end;gap:.5rem;}
.f-pic{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--sand);background:var(--cream);color:var(--text-mid);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.f-pic:hover{border-color:var(--gold);color:var(--gold);}
#f-text{flex:1;min-width:0;resize:none;max-height:120px;padding:.75rem .85rem;background:#fff;border:1px solid var(--sand);color:var(--charcoal);font-family:'Manrope',sans-serif;font-size:.95rem;line-height:1.4;outline:none;}
#f-text:focus{border-color:var(--gold);}
.f-send{flex:0 0 auto;padding:.7rem 1.1rem;background:var(--wine);color:#fff;border:none;font-size:.62rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;height:40px;}
.f-send:hover{background:#a03048;}
.f-send:disabled{opacity:.5;cursor:default;}

.f-closed{padding:1.2rem;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.12rem;color:var(--text-mid);}
.f-err{font-size:.75rem;font-weight:500;color:var(--wine);padding:.4rem .2rem 0;min-height:1rem;}

/* ---------- Tilstande ---------- */
.f-state{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;}
.f-state-box{text-align:center;max-width:380px;}
.f-state-box .eyebrow{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem;}
.f-state-box h2{font-family:'Cinzel',serif;font-weight:300;font-size:1.35rem;letter-spacing:.06em;margin-bottom:.7rem;}
.f-state-box p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;line-height:1.7;color:var(--text-mid);}

/* ---------- Hjemmeskærm-hint ---------- */
.f-hint{display:none;background:rgba(184,138,30,.12);border-bottom:1px solid rgba(143,106,18,.35);padding:.7rem 1rem;align-items:center;gap:.7rem;flex:0 0 auto;}
.f-hint.on{display:flex;}
.f-hint .t{flex:1;font-size:.78rem;line-height:1.45;color:var(--text-mid);}
.f-hint .t b{color:var(--charcoal);font-weight:700;}
.f-hint button{flex:0 0 auto;background:none;border:1px solid var(--sand);color:var(--text-mid);font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.35rem .7rem;cursor:pointer;}

/* ---------- Mistet link ---------- */
.f-lost{margin-top:1.6rem;}
.f-lost input{width:100%;padding:.75rem .9rem;background:#fff;border:1px solid var(--sand);color:var(--charcoal);font-family:'Manrope',sans-serif;font-size:.9rem;outline:none;text-align:center;}
.f-lost input:focus{border-color:var(--gold);}
.f-lost button{width:100%;margin-top:.6rem;padding:.75rem;background:var(--wine);color:#fff;border:none;font-size:.65rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;}
.f-lost .msg{font-size:.82rem;color:var(--text-mid);margin-top:.8rem;line-height:1.6;min-height:1.2rem;}

/* ---------- Lightbox ---------- */
.f-light{display:none;position:fixed;inset:0;background:rgba(20,16,10,.94);z-index:99;align-items:center;justify-content:center;padding:1rem;}
.f-light.on{display:flex;}
.f-light img{max-width:100%;max-height:90vh;object-fit:contain;}
.f-light .x{position:absolute;top:1rem;right:1.2rem;background:none;border:none;color:#fff;font-size:1.8rem;cursor:pointer;line-height:1;}

@media (max-width:600px){
  /* Lås siden fast: kun .f-stream må scrolle. position:fixed på body er det
     eneste, der stopper iOS' gummiband-scroll af hele dokumentet. */
  html{overflow:hidden;overflow-x:hidden;height:100%;}
  body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
  .app{height:100%;max-width:none;}
  .f-stream{overscroll-behavior:contain;}
  .f-header{padding:.75rem 1rem;}
  .f-title{font-size:.82rem;}
  .f-stream{padding:1rem .8rem 1.2rem;}
  .f-bubble-wrap{max-width:80%;}
  .f-body{font-size:1.2rem;}
  .f-send{padding:.7rem .9rem;}
}
</style>
</head>
<body>

<div class="app">
  <header class="f-header">
    <img src="img/taarne-hvid-trans.png" alt="Castillo del Alma">
    <div class="f-head-txt">
      <div class="f-title" id="ch-title">Forum</div>
      <div class="f-sub" id="ch-status">…</div>
    </div>
    <button class="f-bell" id="bell" type="button" title="Lyd og notifikationer">&#128276;</button>
  </header>

  <!-- Føj til hjemmeskærm -->
  <div class="f-hint" id="hint">
    <div class="t" id="hint-txt"></div>
    <button type="button" id="hint-x">OK</button>
  </div>

  <!-- Fejl / venter-tilstand -->
  <div class="f-state" id="state" style="display:none;">
    <div class="f-state-box">
      <div class="eyebrow" id="state-eyebrow">Castillo del Alma</div>
      <h2 id="state-title"></h2>
      <p id="state-text"></p>

      <!-- Mistet dit link? -->
      <div class="f-lost" id="lost" style="display:none;">
        <input type="email" id="lost-email" placeholder="din@email.dk" autocomplete="email">
        <button type="button" id="lost-send"></button>
        <div class="msg" id="lost-msg"></div>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <main class="f-stream" id="stream" style="display:none;"></main>

  <div class="f-input" id="composer" style="display:none;">
    <div class="f-preview" id="preview">
      <img id="preview-img" alt="">
      <div class="nm" id="preview-name"></div>
      <button type="button" id="preview-x">Fjern</button>
    </div>
    <div class="f-row">
      <button class="f-pic" id="pick" type="button" title="Send billede">&#128247;</button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="f-text" rows="1" placeholder="Skriv en besked…"></textarea>
      <button class="f-send" id="send" type="button">Send</button>
    </div>
    <div class="f-err" id="err"></div>
  </div>

  <div class="f-closed" id="closed" style="display:none;"></div>
</div>

<div class="f-light" id="light">
  <button class="x" id="light-x" type="button">&times;</button>
  <img id="light-img" alt="">
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var API = '/.netlify/functions/forum-api';
  var UPLOAD = '/.netlify/functions/forum-upload';
  var POLL_MS = 5000;
  var MAX_DIM = 1600;
  var JPEG_Q = 0.82;

  /* ---------- Sprog ---------- */
  var T = {
    da: {
      placeholder: 'Skriv en besked…', send: 'Send', remove: 'Fjern', del: 'Slet',
      deleted: 'Beskeden er slettet', deletedMod: 'Fjernet af Castillo del Alma',
      today: 'I dag', yesterday: 'I går', welcome: 'Velkommen',
      active: 'Aktivt forum', archived: 'Arkiveret', planned: 'Åbner snart',
      closedTxt: 'Dette forum er arkiveret. I kan stadig læse alt, der er skrevet. 🌿',
      mutedTxt: 'Du kan læse forummet, men ikke skrive i det.',
      badTitle: 'Adgangslinket virker ikke',
      badText: 'Linket er enten forkert eller ikke længere gyldigt. Åbn forummet via linket i din mail, eller under Min booking.',
      soonTitle: 'Forummet er ikke åbnet endnu',
      soonText: 'Vi åbner forummet en uge før jeres ankomst. Du får en mail, så snart det er klart.',
      empty: 'Ingen beskeder endnu — skriv den første.',
      tooBig: 'Billedet er for stort.', failed: 'Noget gik galt. Prøv igen.',
      confirmDel: 'Slet denne besked?',
      hintIos: 'Tip: tryk på <b>Del</b>-ikonet (firkanten med pilen op) og vælg <b>Føj til hjemmeskærm</b> — så ligger forummet som en app på din telefon.',
      hintAndroid: 'Tip: åbn menuen (⋮) og vælg <b>Føj til startskærm</b> — så ligger forummet som en app på din telefon.',
      lostBtn: 'Send mit link',
      lostSent: 'Hvis din e-mail er tilmeldt et forum, har vi netop sendt dit personlige link. Tjek også spam-mappen.',
      lostBad: 'Skriv en gyldig e-mailadresse.',
      bellOn: 'Lyd og notifikationer er slået til',
      bellOff: 'Lyd og notifikationer er slået fra',
      bellBlocked: 'Notifikationer er blokeret i browsersindstillingerne — lyden virker stadig',
      newMsg: 'Ny besked i forummet',
      bellPush: 'Du får nu besked, også når forummet er lukket',
      bellIos: 'Læg forummet på hjemmeskærmen for at få notifikationer, når app\'en er lukket'
    },
    en: {
      placeholder: 'Write a message…', send: 'Send', remove: 'Remove', del: 'Delete',
      deleted: 'Message deleted', deletedMod: 'Removed by Castillo del Alma',
      today: 'Today', yesterday: 'Yesterday', welcome: 'Welcome',
      active: 'Active forum', archived: 'Archived', planned: 'Opening soon',
      closedTxt: 'This forum is archived. You can still read everything written here. 🌿',
      mutedTxt: 'You can read the forum, but not write in it.',
      badTitle: 'This access link does not work',
      badText: 'The link is either incorrect or no longer valid. Open the forum from the link in your email, or under My booking.',
      soonTitle: 'The forum is not open yet',
      soonText: 'We open the forum one week before your arrival. You will get an email as soon as it is ready.',
      empty: 'No messages yet — write the first one.',
      tooBig: 'The image is too large.', failed: 'Something went wrong. Please try again.',
      confirmDel: 'Delete this message?',
      hintIos: 'Tip: tap the <b>Share</b> icon (the square with an arrow) and choose <b>Add to Home Screen</b> — the forum will sit on your phone like an app.',
      hintAndroid: 'Tip: open the menu (⋮) and choose <b>Add to Home screen</b> — the forum will sit on your phone like an app.',
      lostBtn: 'Send my link',
      lostSent: 'If your email is signed up for a forum, we have just sent your personal link. Please check your spam folder too.',
      lostBad: 'Please enter a valid email address.',
      bellOn: 'Sound and notifications are on',
      bellOff: 'Sound and notifications are off',
      bellBlocked: 'Notifications are blocked in your browser settings — sound still works',
      newMsg: 'New message in the forum',
      bellPush: 'You will now be notified even when the forum is closed',
      bellIos: 'Add the forum to your Home Screen to get notifications when the app is closed'
    }
  };
  var lang = 'en';
  try {
    var saved = sessionStorage.getItem('cda_geo_lang');
    var nav = (navigator.language || '').toLowerCase();
    lang = (saved === 'da' || (!saved && nav.indexOf('da') === 0)) ? 'da' : 'en';
  } catch (e) { lang = 'en'; }
  var t = T[lang];
  document.documentElement.lang = lang;

  /* ---------- Token ---------- */
  var token = new URLSearchParams(location.search).get('t') || '';
  try {
    if (token) localStorage.setItem('cda_forum_token', token);
    else token = localStorage.getItem('cda_forum_token') || '';
  } catch (e) { /* privat browsing */ }

  // Sørg for at tokenet ligger i URL'en, når man er logget ind — så en
  // "gem til hjemmeskærm"-genvej altid fanger det (ellers starter PWA'en
  // uden token og kan ikke tilgå forummet på grund af isoleret storage).
  try {
    if (token && !new URLSearchParams(location.search).get('t')) {
      history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(token) + location.hash);
    }
  } catch (e) {}

  var state = { me: null, channel: null, members: {}, last: null, ids: {}, image: null, sending: false };

  /* ---------- Hjælpere ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Brugertekst escapes fuldstændigt; kun URLs gøres klikbare bagefter.
  function linkify(raw) {
    return esc(raw).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>';
    });
  }
  function initials(name) {
    var p = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '?';
    return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  // Stabil farve pr. navn — samme person får altid samme cirkel
  function tint(name) {
    var h = 0, s = String(name || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return 'hsl(' + h + ',32%,42%)';
  }
  function dayLabel(d) {
    var now = new Date(), y = new Date(now.getTime() - 86400000);
    if (d.toDateString() === now.toDateString()) return t.today;
    if (d.toDateString() === y.toDateString()) return t.yesterday;
    return d.toLocaleDateString(lang === 'da' ? 'da-DK' : 'en-GB', { day: 'numeric', month: 'long' });
  }
  function clock(d) {
    return d.toLocaleTimeString(lang === 'da' ? 'da-DK' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  function atBottom() {
    var s = $('stream');
    return s.scrollHeight - s.scrollTop - s.clientHeight < 120;
  }
  function toBottom() { var s = $('stream'); s.scrollTop = s.scrollHeight; }

  function showState(title, text, visLost) {
    $('state').style.display = 'flex';
    $('stream').style.display = 'none';
    $('composer').style.display = 'none';
    $('closed').style.display = 'none';
    $('hint').classList.remove('on');
    $('state-title').textContent = title;
    $('state-text').textContent = text;

    // Ved ugyldigt/manglende link: tilbyd at få linket sendt igen
    if (visLost) {
      $('lost').style.display = 'block';
      $('lost-send').textContent = t.lostBtn;
    } else {
      $('lost').style.display = 'none';
    }
  }

  // Selvbetjening: gæsten skriver sin e-mail og får sit personlige link tilsendt.
  // Svaret er altid det samme — vi afslører aldrig, om e-mailen findes.
  $('lost-send').addEventListener('click', async function () {
    var mail = ($('lost-email').value || '').trim();
    var msg = $('lost-msg');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { msg.textContent = t.lostBad; return; }

    $('lost-send').disabled = true;
    msg.textContent = '…';
    try {
      await fetch('/.netlify/functions/forum-send-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: mail })
      });
      msg.textContent = t.lostSent;
      $('lost-email').value = '';
    } catch (e) {
      msg.textContent = t.failed;
    } finally {
      $('lost-send').disabled = false;
    }
  });

  // "Føj til hjemmeskærm" — vises kun på mobil, kun hvis siden ikke allerede
  // kører som app, og kun én gang (gæsten kan lukke den for altid).
  function visHint() {
    var alleredeApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (alleredeApp) return;
    try { if (localStorage.getItem('cda_forum_hint') === 'skjul') return; } catch (e) {}

    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/i.test(ua);
    var android = /Android/i.test(ua);
    if (!ios && !android) return;

    $('hint-txt').innerHTML = ios ? t.hintIos : t.hintAndroid;
    $('hint').classList.add('on');
  }

  $('hint-x').addEventListener('click', function () {
    $('hint').classList.remove('on');
    try { localStorage.setItem('cda_forum_hint', 'skjul'); } catch (e) {}
  });

  async function call(payload) {
    var res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: token }, payload))
    });
    var data = await res.json().catch(function () { return {}; });
    return { ok: res.ok, status: res.status, data: data };
  }

  /* ---------- Render ---------- */
  function renderWelcome() {
    var txt = (lang === 'da' ? state.channel.welcome_da : state.channel.welcome_en) || '';
    if (!txt.trim()) return;
    var box = document.createElement('div');
    box.className = 'f-welcome';
    // Velkomstteksten er skrevet af jer i admin — inline HTML (<b>, <br>, <em>) er tilladt her
    box.innerHTML = '<div class="lbl">' + esc(t.welcome) + '</div><div class="txt">' + txt + '</div>';
    $('stream').appendChild(box);
  }

  function bubble(m) {
    if (state.ids[m.id]) return;
    state.ids[m.id] = true;

    var stream = $('stream');
    var when = new Date(m.created_at);

    // Dato-skillelinje
    var key = when.toDateString();
    if (state.lastDay !== key) {
      state.lastDay = key;
      var d = document.createElement('div');
      d.className = 'f-day';
      d.innerHTML = '<span>' + esc(dayLabel(when)) + '</span>';
      stream.appendChild(d);
    }

    var mem = state.members[m.member_id] || { display_name: '—', avatar_url: null, role: 'deltager' };
    var mine = state.me && m.member_id === state.me.id;
    var isMod = mem.role === 'moderator';

    var row = document.createElement('div');
    row.className = 'f-msg' + (mine ? ' mine' : '') + (isMod ? ' mod' : '') + (m.deleted ? ' f-deleted' : '');
    row.dataset.id = m.id;
    row.dataset.member = m.member_id || '';

    var av = document.createElement('div');
    av.className = 'f-avatar';
    if (mem.avatar_url) {
      av.innerHTML = '<img src="' + esc(mem.avatar_url) + '" alt="">';
    } else {
      av.style.background = tint(mem.display_name);
      av.textContent = initials(mem.display_name);
    }

    var wrap = document.createElement('div');
    wrap.className = 'f-bubble-wrap';

    var nm = document.createElement('div');
    nm.className = 'f-name';
    nm.innerHTML = esc(mem.display_name) + (isMod ? ' <span class="mod">&#9670;</span>' : '');

    var bub = document.createElement('div');
    bub.className = 'f-bubble';

    if (m.deleted) {
      bub.innerHTML = '<div class="f-body">' + esc(m.deleted_by === 'moderator' ? t.deletedMod : t.deleted) + '</div>';
    } else {
      var html = '<div class="f-body">' + linkify(m.body || '') + '</div>';
      if (m.image_url) {
        html += '<img class="f-img" src="' + esc(m.image_url) + '" alt="" loading="lazy">';
      }
      html += '<div class="f-time">' + esc(clock(when)) + '</div>';
      bub.innerHTML = html;

      var img = bub.querySelector('.f-img');
      if (img) img.addEventListener('click', function () {
        $('light-img').src = img.src;
        $('light').classList.add('on');
      });

      // Egne beskeder (og moderator: alle) kan slettes
      if (mine || (state.me && state.me.role === 'moderator')) {
        var del = document.createElement('button');
        del.className = 'f-del';
        del.type = 'button';
        del.textContent = t.del;
        del.addEventListener('click', function () { removeMessage(m.id, row); });
        bub.appendChild(del);
      }
    }

    wrap.appendChild(nm);
    wrap.appendChild(bub);
    row.appendChild(av);
    row.appendChild(wrap);
    stream.appendChild(row);

    state.last = m.created_at;
  }

  // Nye medlemmer kan dukke op, efter siden er indlæst. Når vi lærer dem at
  // kende, retter vi de bobler, der stod med "—".
  function opdaterRoster(liste) {
    if (!Array.isArray(liste) || !liste.length) return;
    var nye = [];
    liste.forEach(function (m) {
      if (!state.members[m.id]) nye.push(m.id);
      state.members[m.id] = m;
    });
    if (!nye.length) return;

    nye.forEach(function (id) {
      var mem = state.members[id];
      var rows = $('stream').querySelectorAll('[data-member="' + id + '"]');
      Array.prototype.forEach.call(rows, function (row) {
        var isMod = mem.role === 'moderator';
        if (isMod) row.classList.add('mod');

        var nm = row.querySelector('.f-name');
        if (nm) nm.innerHTML = esc(mem.display_name) + (isMod ? ' <span class="mod">&#9670;</span>' : '');

        var av = row.querySelector('.f-avatar');
        if (av) {
          if (mem.avatar_url) {
            av.style.background = '';
            av.innerHTML = '<img src="' + esc(mem.avatar_url) + '" alt="">';
          } else {
            av.innerHTML = '';
            av.style.background = tint(mem.display_name);
            av.textContent = initials(mem.display_name);
          }
        }
      });
    });
  }

  /* ==========================================================
     LYD + NOTIFIKATIONER
     Lyden laves i browseren (WebAudio), så der ikke skal hentes en lydfil.
     Browsere blokerer lyd, indtil brugeren har rørt siden — derfor "låses"
     lyden op ved første tryk.
     ========================================================== */
  var lyd = { til: true, ctx: null, klar: false };
  try { lyd.til = localStorage.getItem('cda_forum_lyd') !== 'fra'; } catch (e) {}

  function laasLydOp() {
    if (lyd.klar) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      lyd.ctx = new AC();
      if (lyd.ctx.state === 'suspended') lyd.ctx.resume();
      lyd.klar = true;
    } catch (e) { /* lyd er ikke tilgængelig */ }
  }

  // To bløde toner — en diskret "pling", ikke et alarmbip
  function spilLyd() {
    if (!lyd.til || !lyd.klar || !lyd.ctx) return;
    try {
      if (lyd.ctx.state === 'suspended') lyd.ctx.resume();
      [[880, 0], [1174.7, 0.11]].forEach(function (par) {
        var osc = lyd.ctx.createOscillator();
        var gain = lyd.ctx.createGain();
        var t0 = lyd.ctx.currentTime + par[1];
        osc.type = 'sine';
        osc.frequency.value = par[0];
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        osc.connect(gain);
        gain.connect(lyd.ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.4);
      });
    } catch (e) { /* ignorér */ }
  }

  function visNotifikation(navn, tekst) {
    if (!lyd.til) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (!document.hidden) return;   // kun når fanen ikke er fremme
    try {
      var n = new Notification(navn || t.newMsg, {
        body: tekst || t.newMsg,
        icon: '/img/forum-icon-192.png',
        badge: '/img/forum-icon-192.png',
        tag: 'cda-forum',           // erstatter forrige i stedet for at stable dem
        renotify: true
      });
      n.onclick = function () { window.focus(); n.close(); };
    } catch (e) { /* ignorér */ }
  }

  /* ---------- PUSH: besked selv når app'en er lukket ----------
     Service workeren lever udenfor siden og bliver vækket af serveren.
     Det er den eneste måde at nå en iPhone, hvor Safari fryser al kode i
     baggrunden. På iOS kræver Apple, at siden ligger på hjemmeskærmen. */
  function base64TilUint8(b64) {
    var pad = '='.repeat((4 - (b64.length % 4)) % 4);
    var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var arr = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  function erApp() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  async function tilmeldPush() {
    if (!state.vapid) return false;
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    if (!('Notification' in window) || Notification.permission !== 'granted') return false;

    try {
      var reg = await navigator.serviceWorker.register('/forum-sw.js', { scope: '/' });
      await navigator.serviceWorker.ready;

      var sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: base64TilUint8(state.vapid)
        });
      }

      var r = await call({ action: 'push_subscribe', subscription: sub.toJSON() });
      return r.ok;
    } catch (e) {
      console.warn('push-tilmelding fejlede:', e.message);
      return false;
    }
  }

  function opdaterKlokke() {
    var b = $('bell');
    b.classList.toggle('on', lyd.til);
    b.innerHTML = lyd.til ? '&#128276;' : '&#128277;';   // 🔔 / 🔕
    b.title = lyd.til ? t.bellOn : t.bellOff;
  }

  $('bell').addEventListener('click', async function () {
    lyd.til = !lyd.til;
    try { localStorage.setItem('cda_forum_lyd', lyd.til ? 'til' : 'fra'); } catch (e) {}

    if (lyd.til) {
      laasLydOp();
      spilLyd();   // lille bekræftelse
      if ('Notification' in window && Notification.permission === 'default') {
        try { await Notification.requestPermission(); } catch (e) {}
      }

      if ('Notification' in window && Notification.permission === 'denied') {
        besked(t.bellBlocked);
      } else {
        var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        // Apple tillader kun push, når siden ligger på hjemmeskærmen
        if (ios && !erApp()) {
          besked(t.bellIos);
        } else {
          var ok = await tilmeldPush();
          besked(ok ? t.bellPush : t.bellOn);
        }
      }
    }
    opdaterKlokke();
  });

  function besked(txt) {
    $('err').textContent = txt;
    setTimeout(function () { if ($('err').textContent === txt) $('err').textContent = ''; }, 6000);
  }

  // Første berøring hvor som helst låser lyden op (browserens krav)
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, laasLydOp, { once: true });
  });

  function markDeleted(id) {
    var row = $('stream').querySelector('[data-id="' + id + '"]');
    if (!row || row.classList.contains('f-deleted')) return;
    row.classList.add('f-deleted');
    var bub = row.querySelector('.f-bubble');
    if (bub) bub.innerHTML = '<div class="f-body">' + esc(t.deleted) + '</div>';
  }

  async function removeMessage(id, row) {
    if (!window.confirm(t.confirmDel)) return;
    var r = await call({ action: 'delete', message_id: id });
    if (r.ok) markDeleted(id);
    else $('err').textContent = (r.data && r.data.error) || t.failed;
  }

  /* ---------- Billede: komprimering i browseren ---------- */
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('read')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('img')); };
        img.onload = function () {
          var w = img.width, h = img.height;
          var scale = Math.min(1, MAX_DIM / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.round(w * scale);
          cv.height = Math.round(h * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          var url = cv.toDataURL('image/jpeg', JPEG_Q);
          resolve({ dataUrl: url, base64: url.split(',')[1] });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  $('pick').addEventListener('click', function () { $('file').click(); });

  $('file').addEventListener('change', async function (e) {
    var file = e.target.files && e.target.files[0];
    $('file').value = '';
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) { $('err').textContent = t.tooBig; return; }
    $('err').textContent = '';
    try {
      var out = await compress(file);
      state.image = { base64: out.base64, name: file.name };
      $('preview-img').src = out.dataUrl;
      $('preview-name').textContent = file.name;
      $('preview').classList.add('on');
    } catch (err) {
      $('err').textContent = t.failed;
    }
  });

  $('preview-x').addEventListener('click', function () {
    state.image = null;
    $('preview').classList.remove('on');
    $('preview-img').src = '';
  });

  /* ---------- Send ---------- */
  async function send() {
    if (state.sending) return;
    var body = $('f-text').value.trim();
    if (!body && !state.image) return;

    state.sending = true;
    $('send').disabled = true;
    $('err').textContent = '';

    try {
      var image_path = null;
      if (state.image) {
        var up = await fetch(UPLOAD, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token, content_type: 'image/jpeg',
            filename: state.image.name, data: state.image.base64
          })
        });
        var updata = await up.json().catch(function () { return {}; });
        if (!up.ok) throw new Error(updata.error || t.failed);
        image_path = updata.image_path;
      }

      var r = await call({ action: 'send', body: body, image_path: image_path });
      if (!r.ok) throw new Error((r.data && r.data.error) || t.failed);

      $('f-text').value = '';
      $('f-text').style.height = 'auto';
      state.image = null;
      $('preview').classList.remove('on');
      if (r.data.message) { bubble(r.data.message); toBottom(); }
    } catch (err) {
      $('err').textContent = err.message || t.failed;
    } finally {
      state.sending = false;
      $('send').disabled = false;
    }
  }

  $('send').addEventListener('click', send);

  var ta = $('f-text');
  ta.addEventListener('input', function () {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', function (e) {
    // Enter sender på computer; på mobil giver Enter linjeskift (tastaturet har sin egen send-knap)
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:601px)').matches) {
      e.preventDefault();
      send();
    }
  });

  $('light-x').addEventListener('click', function () { $('light').classList.remove('on'); });
  $('light').addEventListener('click', function (e) {
    if (e.target === $('light')) $('light').classList.remove('on');
  });

  /* ---------- Poll ---------- */
  async function poll() {
    if (document.hidden || !state.last) return;
    var r = await call({ action: 'poll', since: state.last });
    if (!r.ok) return;

    var stick = atBottom();
    opdaterRoster(r.data.members);

    var nye = (r.data.messages || []);
    // Kun beskeder fra andre skal give lyd — ikke ens egne
    var fraAndre = nye.filter(function (m) { return !state.me || m.member_id !== state.me.id; });

    nye.forEach(bubble);
    (r.data.deleted_ids || []).forEach(markDeleted);
    if (stick) toBottom();

    if (fraAndre.length) {
      spilLyd();
      var sidste = fraAndre[fraAndre.length - 1];
      var afs = state.members[sidste.member_id];
      visNotifikation(
        afs ? afs.display_name : t.newMsg,
        sidste.body ? sidste.body.slice(0, 120) : '📷'
      );
    }

    if (r.data.status && r.data.status !== state.channel.status) location.reload();
  }

  /* ---------- Start ---------- */
  async function init() {
    if (!token) { showState(t.badTitle, t.badText, true); return; }

    var r = await call({ action: 'init' });

    if (!r.ok) {
      if (r.status === 403) showState(t.soonTitle, t.soonText, false);
      else showState(t.badTitle, t.badText, true);
      return;
    }

    state.channel = r.data.channel;
    state.me = r.data.me;
    state.vapid = r.data.vapid_public || '';
    (r.data.members || []).forEach(function (m) { state.members[m.id] = m; });

    $('ch-title').textContent = state.channel.title;
    var st = $('ch-status');
    st.textContent = state.channel.status === 'aktiv' ? t.active
      : state.channel.status === 'arkiveret' ? t.archived : t.planned;
    st.className = 'f-sub ' + state.channel.status;

    $('state').style.display = 'none';
    $('stream').style.display = 'block';

    renderWelcome();
    var msgs = r.data.messages || [];
    msgs.forEach(bubble);

    if (!msgs.length) {
      var e = document.createElement('div');
      e.className = 'f-day';
      e.innerHTML = '<span>' + esc(t.empty) + '</span>';
      $('stream').appendChild(e);
      state.last = new Date(Date.now() - 86400000).toISOString();
    }

    if (r.data.can_write) {
      $('composer').style.display = 'block';
      ta.placeholder = t.placeholder;
      $('send').textContent = t.send;
      $('preview-x').textContent = t.remove;
    } else {
      $('closed').style.display = 'block';
      $('closed').textContent = state.me.muted ? t.mutedTxt : t.closedTxt;
    }

    toBottom();
    opdaterKlokke();
    visHint();

    // Har gæsten allerede givet lov, sikrer vi stille og roligt, at enheden
    // stadig er tilmeldt (fx efter at app'en er lagt på hjemmeskærmen)
    if (lyd.til && 'Notification' in window && Notification.permission === 'granted') {
      tilmeldPush();
    }
    call({ action: 'read' });
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { poll(); call({ action: 'read' }); }
    });
  }

  init();
})();
</script>
</body>
</html>
